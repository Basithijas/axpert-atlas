<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlas">
<meta name="description" content="Axpert Atlas: read-only developer console for Axpert ERP">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Axpert Atlas</title>
<meta name="robots" content="noindex, nofollow">
<!-- Axpert Atlas build 202611101132. Read-only. Offline: no CDN, no font link, no chart library; inline SVG + canvas only. -->
<style>
:root{
  --bg:#f6f8fc;--surf:#ffffff;--surf2:#f1f3f4;--surf3:#e9eef6;--ink:#1f1f1f;--ink2:#444746;--ink3:#747775;--line:#e1e3e1;--line2:#c4c7c5;
  --blue:#1a73e8;--blueb:#e8f0fe;--green:#188038;--greenb:#e6f4ea;--amber:#b06000;--amberb:#fef7e0;--red:#d93025;--redb:#fce8e6;
  --purple:#9334e6;--purpleb:#f3e8fd;--teal:#007b83;--tealb:#e4f7fb;--grey:#5f6368;--greyb:#f1f3f4;
  --e1:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);--e2:0 1px 2px rgba(60,64,67,.3),0 2px 6px 2px rgba(60,64,67,.15);
  --e3:0 4px 8px 3px rgba(60,64,67,.15),0 1px 3px rgba(60,64,67,.3);
  --r:16px;--ease:cubic-bezier(.2,0,0,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --font:"Google Sans Text","Google Sans","Roboto","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --disp:"Google Sans Display","Google Sans","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --mono:"Roboto Mono","Cascadia Mono",ui-monospace,Consolas,monospace;
  --nav:256px;
}
:root[data-theme="dark"]{
  --bg:#131314;--surf:#1e1f20;--surf2:#282a2c;--surf3:#2d3035;--ink:#e3e3e3;--ink2:#c4c7c5;--ink3:#8e918f;--line:#333537;--line2:#4a4d50;
  --blue:#8ab4f8;--blueb:#25334a;--green:#81c995;--greenb:#1f3326;--amber:#fdd663;--amberb:#3a321a;--red:#f28b82;--redb:#432523;
  --purple:#c58af9;--purpleb:#36284a;--teal:#78d9ec;--tealb:#1b3a40;--grey:#9aa0a6;--greyb:#2a2c2e;
  --e1:0 1px 2px rgba(0,0,0,.5);--e2:0 2px 6px rgba(0,0,0,.5);--e3:0 8px 22px rgba(0,0,0,.55);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:currentColor;flex:none}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--blueb)}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:3px solid var(--bg)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--nav) minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:0;height:100vh;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 14px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:conic-gradient(from 210deg,#4285f4,#34a853,#fbbc04,#ea4335,#4285f4)}
.logo span{width:30px;height:30px;border-radius:9px;background:#1a73e8;display:grid;place-items:center}
.logo svg{width:18px;height:18px;fill:#fff}
.brand b{display:block;font:500 18px/1.1 var(--disp);letter-spacing:-.2px}
.brand small{color:var(--ink3);font-size:12px}
.modsw{margin:0 4px 12px;border:1px solid var(--line2);border-radius:12px;background:var(--surf);padding:6px}
.modsw .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:2px 8px 4px;font-weight:500}
.mod{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:8px;font-size:13.5px;color:var(--ink2);text-decoration:none;transition:background .2s}
a.mod:hover{background:var(--surf2)}
.mod.on{background:var(--blueb);color:var(--blue);font-weight:500}
.mod i{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}
.mod.on i{background:var(--blue)}
.mod small{margin-left:auto;font-size:11px;color:var(--ink3)}
.ni{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;border:0;background:none;width:100%;height:44px;padding:0 16px;border-radius:999px;cursor:pointer;
  font-weight:500;font-size:14px;color:var(--ink2);text-align:left;transition:background .2s var(--ease)}
.ni:hover{background:var(--surf2)}
.ni.on{background:var(--blueb);color:var(--blue)}
.ni .b{margin-left:auto;font-size:12px;font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums}
.ni .b.r{background:var(--red);color:#fff;border-radius:999px;padding:0 8px;line-height:20px}
.navfoot{margin-top:auto;padding:14px 12px 4px;font-size:11.5px;color:var(--ink3);border-top:1px solid var(--line)}
.navfoot b{color:var(--ink2);font-weight:500}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--green);animation:live 2.4s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

.main{min-width:0;display:flex;flex-direction:column}
.appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.appbar.lift{border-color:var(--line);box-shadow:0 1px 6px rgba(60,64,67,.12)}
.hamb{display:none!important}
.search{flex:1;max-width:720px;display:flex;align-items:center;gap:12px;height:48px;padding:0 8px 0 16px;border-radius:999px;background:var(--surf3);border:0;cursor:text;color:var(--ink3);
  transition:background .2s,box-shadow .2s;text-align:left;min-width:0}
.search:hover{background:var(--surf);box-shadow:var(--e1)}
.search span{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font:500 11px var(--mono);border:1px solid var(--line2);border-radius:6px;padding:2px 7px;color:var(--ink3);background:var(--surf)}
.sp{flex:1}
.ib{position:relative;overflow:hidden;width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--ink2);display:grid;place-items:center;cursor:pointer;transition:background .2s;flex:none}
.ib:hover{background:var(--surf2)}
.ro{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--greenb);color:var(--green);font-size:12.5px;font-weight:500;white-space:nowrap}
.ro svg{width:16px;height:16px}
.view{padding:6px 28px 80px;max-width:1520px;width:100%;margin:0 auto}
.view>*{animation:fadeup .35s var(--ease) both}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}}

/* ---------- page head ---------- */
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:14px 0 18px}
.ph h1{font:400 30px/1.15 var(--disp);letter-spacing:-.4px;margin:0}
.ph p{margin:4px 0 0;color:var(--ink2);max-width:780px}
.crumbs{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink3);flex-wrap:wrap;margin-top:10px}
.crumbs a,.lnk{color:var(--blue);cursor:pointer;text-decoration:none}.crumbs a:hover,.lnk:hover{text-decoration:underline}
.crumbs svg{width:16px;height:16px;fill:var(--ink3)}

/* ---------- cards / bento ---------- */
.card{position:relative;background:var(--surf);border-radius:var(--r);box-shadow:var(--e1);min-width:0;transition:box-shadow .25s var(--ease),transform .3s var(--ease)}
.card.hov:hover{box-shadow:var(--e3)}
.spot::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(380px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--k,var(--blue)) 9%,transparent),transparent 60%)}
.spot:hover::after{opacity:1}
.ch{display:flex;align-items:center;gap:10px;padding:16px 20px 6px;flex-wrap:wrap}
.ch h3{font:500 16px/1.3 var(--font);margin:0;display:flex;align-items:center;gap:8px}
.ch .hint{font-size:12.5px;color:var(--ink3);width:100%;margin-top:-4px;order:3}
.ch .act{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.cb{padding:8px 20px 18px}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.bento>div{min-width:0}
.bento>div>.card{height:100%}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}

/* KPI scorecards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:16px}
.kpi{position:relative;overflow:hidden;background:var(--surf);border-radius:var(--r);box-shadow:var(--e1);padding:16px 18px 14px;border:0;text-align:left;cursor:pointer;
  transition:transform .35s var(--spring),box-shadow .3s var(--ease)}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--e3)}
.kpi::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(240px circle at var(--mx,50%) var(--my,-40%),color-mix(in srgb,var(--k,var(--blue)) 14%,transparent),transparent 60%)}
.kpi:hover::before{opacity:1}
.kpi .top{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:13px;font-weight:500}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--k,var(--blue)) 14%,transparent);color:var(--k,var(--blue))}
.ic svg{width:19px;height:19px;fill:currentColor}
.kpi .v{font:400 34px/1.1 var(--disp);letter-spacing:-.5px;margin:12px 0 2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--ink3)}
.kpi .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--k,var(--blue));transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.kpi:hover .bar{transform:scaleX(1)}

/* chips, buttons, fields */
.tool{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{position:relative;overflow:hidden;border:1px solid var(--line2);background:var(--surf);border-radius:8px;padding:5px 12px;font-weight:500;font-size:13px;color:var(--ink2);cursor:pointer;
  display:inline-flex;gap:6px;align-items:center;transition:background .2s}
.chip:hover{background:var(--surf2)}
.chip.on{background:var(--blueb);border-color:transparent;color:var(--blue)}
.chip.on::before{content:"";width:4px;height:8px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px);margin:0 3px 0 2px}
.chip .n{font-variant-numeric:tabular-nums;color:var(--ink3)}.chip.on .n{color:inherit}
.field{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:999px;padding:0 14px;background:var(--surf);height:40px;transition:border-color .2s,box-shadow .2s;min-width:0}
.field:focus-within{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.field input,.field select{border:0;outline:0;background:transparent;color:var(--ink);font:14px var(--font);min-width:0}
.field input{width:240px}
.field select{max-width:260px;cursor:pointer}
.field svg{width:18px;height:18px;fill:var(--ink3)}
.btn{position:relative;overflow:hidden;border:1px solid var(--line2);background:var(--surf);color:var(--blue);border-radius:999px;padding:7px 16px;font-weight:500;font-size:13.5px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:background .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{background:var(--blueb)}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--surf)}
.btn.pri:hover{box-shadow:var(--e1)}
.cnt{margin-left:auto;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.18;animation:rip .6s linear;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

/* status pills */
.st{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;white-space:nowrap;line-height:1.5}
.st svg{width:14px;height:14px;fill:currentColor}
.st-green{background:var(--greenb);color:var(--green)}.st-blue{background:var(--blueb);color:var(--blue)}.st-amber{background:var(--amberb);color:var(--amber)}
.st-red{background:var(--redb);color:var(--red)}.st-grey{background:var(--greyb);color:var(--grey)}.st-purple{background:var(--purpleb);color:var(--purple)}.st-teal{background:var(--tealb);color:var(--teal)}
.tg{display:inline-block;border-radius:6px;padding:0 6px;font:500 10.5px/18px var(--mono);letter-spacing:.03em;white-space:nowrap}
.tg-hid{background:var(--greyb);color:var(--grey)}.tg-ro{background:var(--blueb);color:var(--blue)}.tg-req{background:var(--amberb);color:var(--amber)}
.tg-fx{background:var(--purpleb);color:var(--purple)}.tg-uq{background:var(--tealb);color:var(--teal)}

/* tables */
.tw{overflow:auto;max-height:70vh;border-radius:0 0 var(--r) var(--r)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
th{position:sticky;top:0;z-index:2;background:var(--surf);color:var(--ink2);font-weight:500;font-size:12.5px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th.s{cursor:pointer}th.s:hover{color:var(--ink)}
th .ar{display:inline-block;width:14px;opacity:.3;margin-left:2px}th.sorted .ar{opacity:1;color:var(--blue)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr.go{cursor:pointer}
tbody tr:hover{background:color-mix(in srgb,var(--blue) 6%,transparent)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td .sub{display:block;font:12px var(--mono);color:var(--ink3)}
td b{font-weight:500}
.dim{color:var(--ink3)}
.ishid td{opacity:.6}
.person{display:flex;align-items:center;gap:10px;min-width:190px}
.person b{font-weight:500;display:block;line-height:1.25}.person small{color:var(--ink3);font:12px var(--mono)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:500;font-size:12px;flex:none}
.avs{display:flex}.avs .av{width:26px;height:26px;font-size:10.5px;border:2px solid var(--surf);margin-left:-8px}.avs .av:first-child{margin-left:0}
.avs .more{background:var(--surf2);color:var(--ink2)}
.more-row{display:flex;justify-content:center;padding:12px}
.empty{padding:44px 20px;text-align:center;color:var(--ink3)}
.empty svg{width:48px;height:48px;fill:var(--line2);display:block;margin:0 auto 8px}

/* charts */
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{flex:none}
.donut circle.seg{fill:none;cursor:pointer;transition:stroke-width .2s var(--ease);animation:sweep 1.1s var(--ease) both}
.donut circle.seg:hover{stroke-width:24}
@keyframes sweep{from{stroke-dasharray:0 1000}}
.donut .c1{font:400 30px var(--disp);fill:var(--ink)}.donut .c2{font:12px var(--font);fill:var(--ink3)}
.dl{display:flex;flex-direction:column;gap:2px;min-width:170px;flex:1}
.dl .r{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;transition:background .15s}
.dl .r[data-go^="#"]{cursor:pointer}
.dl .r:hover{background:var(--surf2)}
.dl .r b{font-weight:500;font-variant-numeric:tabular-nums}.dl .r small{color:var(--ink3);min-width:38px;text-align:right}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.hb{display:grid;grid-template-columns:minmax(120px,220px) 1fr 52px;gap:10px;align-items:center;padding:5px 6px;border-radius:8px;transition:background .15s}
.hb[data-go^="#"]{cursor:pointer}
.hb:hover{background:var(--surf2)}
.hb .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;min-width:0}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:500;font-size:13px}
.track{height:10px;border-radius:99px;background:var(--surf2);overflow:hidden;display:flex}
.track span{display:block;height:100%;transform-origin:left;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{font-weight:500}
.stack100{height:14px;border-radius:99px;overflow:hidden;display:flex;background:var(--surf2)}
.stack100 span{height:100%;transform-origin:left;animation:grow .9s var(--ease) both}
.sec{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:500;margin:18px 0 8px}

/* tabs */
.tabs{position:relative;display:flex;gap:2px;border-bottom:1px solid var(--line);margin:8px 0 20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;overflow:hidden;border:0;background:none;padding:12px 18px 13px;font-weight:500;font-size:14px;color:var(--ink2);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;flex:none}
.tab:hover{background:var(--surf2)}.tab.on{color:var(--blue)}
.tab .n{font-size:12px;color:var(--ink3);background:var(--surf2);border-radius:999px;padding:0 7px}
.tab.on .n{background:var(--blueb);color:var(--blue)}
.ind{position:absolute;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--blue);transition:left .35s var(--ease),width .35s var(--ease)}

/* hero */
.hero{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;padding:22px 24px}
.hero .big{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--k,var(--blue)) 14%,transparent);color:var(--k,var(--blue))}
.hero .big svg{width:28px;height:28px;fill:currentColor}
.hero h2{font:400 28px/1.15 var(--disp);margin:0;letter-spacing:-.3px;overflow-wrap:anywhere}
.hero .meta{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--ink2);align-items:center}
.hero .meta code{font:500 12.5px var(--mono);background:var(--surf2);padding:1px 7px;border-radius:6px;overflow-wrap:anywhere}
.hero .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* rule flow */
.rule{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--surf)}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:stretch;margin-top:10px}
.step{border-radius:10px;background:var(--surf2);padding:10px 12px;position:relative;min-width:0}
.step+.step::before{content:"";position:absolute;left:-10px;top:50%;width:10px;height:2px;background:var(--line2)}
.step .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.step .v{font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.step code,.rule code{font:12.5px var(--mono);overflow-wrap:anywhere}
.rule .rm{font-size:12.5px;color:var(--ink3);margin-top:8px}
.rule .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rule .hd b{font-weight:500}

/* settings */
.sets{display:flex;gap:8px;flex-wrap:wrap}
.setp{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:500;border:1px solid var(--line2);color:var(--ink3)}
.setp.on{border-color:transparent;background:var(--greenb);color:var(--green)}
.setp svg{width:14px;height:14px;fill:currentColor}

/* DC anatomy */

/* Encrypted copy (GitHub Pages): window.ATLAS_LOCK is set and data/<name>.bin = 12-byte IV + AES-256-GCM(deflate(js)).
   The key comes from the password (PBKDF2-SHA256) and never leaves this browser. */
let LOCKKEY=null;

  if(window.ATLAS_LOCK)return loading[name]=fetch("data/"+name+".bin?v="+BUILD).then(r=>{if(!r.ok)throw new Error("data/"+name+".bin");return r.arrayBuffer();})

  return loading[name]=new Promise((res,rej)=>{const s=document.createElement("script");s.src="data/"+name+".js?v="+BUILD;s.onload=res;s.onerror=()=>{delete loading[name];rej(new Error("data/"+name+".js"));};document.head.appendChild(s);});}

  const fallback=()=>{const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();try{document.execCommand("copy");done();}catch(e){toast("Copy not allowed here");}t.remove();};
  try{navigator.clipboard.writeText(text).then(done,fallback);}catch(e){fallback();}}
function csv(name,head,rows){
  const q=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const blob=new Blob(["﻿"+[head].concat(rows).map(r=>r.map(q).join(",")).join("\r\n")],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name+".csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast(name+".csv saved");}
function countUp(root){$$("[data-count]",root).forEach(el=>{if(el._c)return;el._c=1;const to=+el.dataset.count,t0=performance.now(),d=900;
  const step=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=fmt(Math.round(to*e));if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);});}
document.addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;const c=e.target.closest&&e.target.closest(".spot,.kpi");if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty("--mx",(e.clientX-r.left)+"px");c.style.setProperty("--my",(e.clientY-r.top)+"px");});
document.addEventListener("pointerdown",e=>{const b=e.target.closest&&e.target.closest(".btn,.chip,.ni,.tab,.ib,.kpi,.bnav button");if(!b)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="ripple";s.style.cssText="width:"+d+"px;height:"+d+"px;left:"+(e.clientX-r.left-d/2)+"px;top:"+(e.clientY-r.top-d/2)+"px";b.appendChild(s);setTimeout(()=>s.remove(),600);});

const kpi=(icon,k,label,val,sub,go)=>'<button class="kpi" style="--k:'+k+'"'+(go?' data-go="'+go+'"':"")+'><div class="top"><span class="ic">'+ico(icon)+'<\/span>'+label+'<\/div><div class="v" data-count="'+val+'">0<\/div><div class="s">'+sub+'<\/div><span class="bar"><\/span><\/button>';
function donut(segs,center,sub){
  const tot=segs.reduce((a,s)=>a+s.v,0)||1,r=56,C=2*Math.PI*r;let off=0;
  const arcs=segs.filter(s=>s.v).map((s,i)=>{const len=s.v/tot*C;const g='<circle class="seg" r="'+r+'" cx="80" cy="80" stroke="'+s.c+'" stroke-width="20" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 80 80)" style="animation-delay:'+(i*.08)+'s"'+(s.go?' data-go="'+s.go+'"':"")+'><title>'+esc(s.l)+': '+s.v+'<\/title><\/circle>';off+=len;return g;}).join("");
  const svg='<svg class="donut" width="160" height="160" viewBox="0 0 160 160"><circle r="'+r+'" cx="80" cy="80" fill="none" stroke="var(--surf2)" stroke-width="20"/>'+arcs+'<text x="80" y="84" text-anchor="middle" class="c1">'+fmt(center)+'<\/text><text x="80" y="104" text-anchor="middle" class="c2">'+esc(sub)+'<\/text><\/svg>';
  return '<div class="donutwrap">'+svg+'<div class="dl">'+segs.map(s=>'<div class="r"'+(s.go?' data-go="'+s.go+'"':"")+'><span class="sw" style="background:'+s.c+'"><\/span><span>'+esc(s.l)+'<\/span><b>'+fmt(s.v)+'<\/b><small>'+pct(s.v,tot)+'%<\/small><\/div>').join("")+'<\/div><\/div>';
}
function hbars(items,max){max=max||Math.max(1,...items.map(x=>x.v));
  return items.map((x,i)=>'<div class="hb"'+(x.go?' data-go="'+x.go+'"':"")+' title="'+esc(x.l)+'"><span class="l">'+esc(x.l)+'<\/span><span class="track">'+
    (x.parts||[{v:x.v,c:x.c||"var(--blue)"}]).map(p=>'<span style="width:'+(p.v/max*100)+'%;background:'+p.c+';animation-delay:'+(i*.03)+'s"><\/span>').join("")+'<\/span><span class="v">'+fmt(x.v)+'<\/span><\/div>').join("");}
function stack100(parts){const t=parts.reduce((a,p)=>a+p.v,0)||1;
  return '<div class="stack100">'+parts.map(p=>'<span title="'+esc(p.l)+': '+p.v+'" style="width:'+(p.v/t*100)+'%;background:'+p.c+'"><\/span>').join("")+'<\/div><div class="legend">'+parts.map(p=>'<span><i class="sw" style="background:'+p.c+'"><\/i>'+esc(p.l)+' <b>'+fmt(p.v)+'<\/b> <span class="dim">'+pct(p.v,t)+'%<\/span><\/span>').join("")+'<\/div>';}

/* sortable table: cols=[{h,k(row)->sort value,r(row)->html,num}] ; on phones every row becomes a card */
const TS={};
const strip=h=>String(h).replace(/<[^>]+>/g,"");
function table(id,cols,rows,opt={}){
  id=(CUR||"home")+":"+id;
  const st=TS[id]||(TS[id]={k:opt.sort||0,d:opt.dir||-1,lim:opt.lim||150});
  const c=cols[st.k];const sorted=rows.slice().sort((a,b)=>{const x=c.k(a),y=c.k(b);return (x>y?1:x<y?-1:0)*st.d;});
  const shown=sorted.slice(0,st.lim);
  return '<div class="tw"><table data-t="'+esc(id)+'"><thead><tr>'+cols.map((c,i)=>'<th class="s'+(c.num?" num":"")+(i===st.k?" sorted":"")+'" data-i="'+i+'">'+c.h+'<span class="ar">'+(i===st.k?(st.d>0?"↑":"↓"):"↕")+'<\/span><\/th>').join("")+'<\/tr><\/thead><tbody>'+
    (shown.length?shown.map(r=>'<tr class="'+(opt.go?"go ":"")+(opt.cls?opt.cls(r):"")+'"'+(opt.go?' data-go="'+esc(opt.go(r))+'"':"")+'>'+cols.map(c=>'<td data-l="'+esc(strip(c.h))+'"'+(c.num?' class="num"':"")+'>'+c.r(r)+'<\/td>').join("")+'<\/tr>').join(""):'<tr><td colspan="'+cols.length+'"><div class="empty">'+ico("info")+'Nothing matches this filter.<\/div><\/td><\/tr>')+'<\/tbody><\/table>'+
    (sorted.length>st.lim?'<div class="more-row"><button class="btn" data-more="'+esc(id)+'">Show more · '+fmt(sorted.length-st.lim)+' left<\/button><\/div>':"")+'<\/div>';
}
function bindTables(root,redraw){
  $$("table[data-t] th.s",root).forEach(th=>th.onclick=()=>{const st=TS[th.closest("table").dataset.t],i=+th.dataset.i;if(st.k===i)st.d*=-1;else{st.k=i;st.d=-1;}redraw();});
  $$("[data-more]",root).forEach(b=>b.onclick=()=>{TS[b.dataset.more].lim+=200;redraw();});
  bindGo(root);
}

function route(){
  if(window.ATLAS_LOCK&&!LOCKKEY)return;
  const p=rawParts(),m=p[0]||"";
  closeDrawer();closePal();
  if(!ATLAS.mods){showLoading("Loading…");return;}
  let fn,navKey,key;
  if(!m){navKey="home";fn=vHome;key="home";}
  else if(m==="all"){
    if(!ATLAS.people){showLoading("Loading people…");load("people").then(()=>ATLAS.people?route():showErr("people"),()=>showErr("people"));return;}
    const needP=["projects","project","companies","company","person"].includes(p[1]);
    if(needP&&!ATLAS.proj){showLoading("Loading projects and companies…");load("projects").then(()=>ATLAS.proj?route():showErr("projects"),()=>showErr("projects"));return;}
    navKey={projects:"projects",project:"projects",companies:"companies",company:"companies"}[p[1]]||"allpeople";key="all/"+(p[1]||"")+"/"+(p[2]||"");
    fn={person:()=>vAllPerson(p[2]),projects:vProjects,project:()=>vProject(p[2]),companies:vCompanies,company:()=>vCompany(p[2])}[p[1]]||vAllPeople;
  } else {
    const mod=ATLAS.mods.find(x=>x.slug===m);if(!mod){location.hash="#/";return;}
    if(!ATLAS.data[m]){showLoading("Loading "+mod.name+"…");load(m).then(()=>ATLAS.data[m]?route():showErr(m),()=>showErr(m));return;}
    useModule(m);
    const h=p.slice(1),v=h[0]||"overview";
    navKey={screen:"screens",person:"people",role:"roles"}[v]||v;key=m+"/"+v+"/"+(h[1]||"")+"/"+(h[2]||"");
    fn={overview:vOverview,screens:()=>vScreens(h[1]||""),screen:()=>vScreen(h[1],h[2],h[3]),matrix:vMatrix,people:vPeople,person:()=>vPerson(h[1]),
        roles:vRoles,role:()=>vRole(h[1]),health:()=>vHealth(h[1]),changes:vChanges,galaxy:vGalaxy}[v]||vOverview;
  }
  navNow=navKey;renderNav(navKey);
  const glob=["home","allpeople","projects","companies"].includes(navKey);
  $("#searchHint").textContent=glob?"Search modules, people, projects, companies":"Search "+M.module+": screens, fields, roles, people";
  fn();if(key!==lastView)window.scrollTo(0,0);lastView=key;
  countUp($("#view"));bindGo($("#view"));
}

    const cols=[{h:"Person",k:u=>(pp[u].nm||u).toLowerCase(),r:u=>'<div class="person">'+av(u)+'<div><b>'+esc(pp[u].nm||u)+'<\/b><small>'+esc(u)+'<\/small><\/div><\/div>'},
      {h:"Department",k:u=>pp[u].dept||"",r:u=>'<span class="dim">'+esc(pp[u].dept||"–")+'<\/span>'},
      {h:"HR status",k:u=>hrOf(pp[u].hr),r:u=>hrPill(pp[u].hr)},
      {h:"Modules",num:1,k:u=>Object.keys(pp[u].m).length,r:u=>Object.keys(pp[u].m).length}]
      .concat(mods.map(m=>({h:esc(m.name),num:1,k:u=>pp[u].m[m.slug]?pp[u].m[m.slug][1]+pp[u].m[m.slug][2]:-1,r:u=>pp[u].m[m.slug]?(pp[u].m[m.slug][1]+pp[u].m[m.slug][2]):'<span class="dim">–<\/span>'})));

function scFields(s,body,fld){
  const f=s.f,chips=[["all","All",()=>true],["vis","On screen",x=>!x.hid],["hid","Hidden",x=>x.hid],["ro","Read-only",x=>x.ro],["req","Mandatory",x=>x.req],["fx","Has formula",x=>x.ex||x.vx],["uq","No duplicates",x=>x.nodup]];
  if(fDC&&!s.dcs.some(d=>(d.n||"").toLowerCase()===fDC.toLowerCase()))fDC="";
  const draw=()=>{
    const fn=chips.find(c=>c[0]===fF)[2];
    const L=f.filter(x=>fn(x)&&(!fDC||(x.dc||"").toLowerCase()===fDC.toLowerCase())&&(!fQ||(x.n+" "+(x.cap||"")+" "+(x.ex||"")+" "+(x.vx||"")).toLowerCase().includes(fQ)));
    let h='<div class="tool"><div class="chips">'+chips.map(c=>'<button class="chip'+(fF===c[0]?" on":"")+'" data-f="'+c[0]+'">'+c[1]+' <span class="n">'+f.filter(c[2]).length+'<\/span><\/button>').join("")+'<\/div><\/div>'+
      '<div class="tool"><label class="field"><select id="fdc"><option value="">All DCs ('+s.dcs.length+')<\/option>'+s.dcs.map(d=>'<option value="'+esc(d.n)+'"'+((fDC||"").toLowerCase()===(d.n||"").toLowerCase()?" selected":"")+'>'+esc(d.n+" · "+(d.cap||""))+'<\/option>').join("")+'<\/select><\/label>'+
      '<label class="field">'+ico("field")+'<input id="fq" placeholder="Field, caption or formula" value="'+esc(fQ)+'"><\/label><span class="cnt">'+L.length+' of '+f.length+' · tap a row for details<\/span><button class="btn" id="fx">'+ico("dl")+'CSV<\/button><\/div>';
    h+='<section class="card">'+table("fields_"+s.id,[
      {h:"DC",k:x=>(x.dc||"").padStart(6,"0")+String(x.o).padStart(4,"0"),r:x=>'<span class="mono dim" style="font-size:12px">'+esc(x.dc||"")+'<\/span>'},
      {h:"#",num:1,k:x=>x.o||0,r:x=>x.o==null?"":x.o},
      {h:"Caption / field",k:x=>(x.cap||x.n).toLowerCase(),r:x=>'<b>'+esc(x.cap||"–")+'<\/b><span class="sub">'+esc(x.n)+'<\/span>'},
      {h:"Type",k:x=>x.m||"",r:x=>esc(x.m||"")+'<span class="sub">'+esc((x.ty||"")+(x.w?"("+x.w+")":""))+'<\/span>'},
      {h:"Flags",k:x=>(x.hid?"a":"")+(x.ro?"b":"")+(x.req?"c":""),r:x=>'<div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">'+(x.hid?'<span class="tg tg-hid">HIDDEN<\/span>':"")+(x.ro?'<span class="tg tg-ro">READ-ONLY<\/span>':"")+(x.req?'<span class="tg tg-req">MANDATORY<\/span>':"")+(x.nodup?'<span class="tg tg-uq">UNIQUE<\/span>':"")+((x.ex||x.vx)?'<span class="tg tg-fx">FX<\/span>':"")+'<\/div>'},
      {h:"Logic",k:x=>x.ex||x.vx||x.src||"",r:x=>{const t=x.ex||x.vx||(x.src?"from "+x.src:"")||(x.lst?"list: "+x.lst:"");return t?'<span class="mono" style="font-size:12px;color:var(--ink2);display:block;max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(t)+'<\/span>':'<span class="dim">–<\/span>';}}],
      L,{sort:0,dir:1,lim:500,cls:x=>x.hid?"ishid":"",go:x=>"#/screen/"+s.id+"/fields/"+enc(x.n)})+'<\/section>';
    body.innerHTML=h;

function openField(s,name){
  const x=s.f.find(z=>z.n===name);if(!x)return;
  const dc=s.dcs.find(d=>(d.n||"").toLowerCase()===(x.dc||"").toLowerCase())||{};
  const nm=x.n.toLowerCase(),words=t=>(t||"").toLowerCase().split(/[^a-z0-9_]+/);
  const drivenBy=s.f.filter(z=>z.dep&&words(z.dep).includes(nm)).map(z=>z.n);
  const usedIn=s.f.filter(z=>z!==x&&words((z.ex||"")+" "+(z.vx||"")).includes(nm)).map(z=>z.n);
  const flag=(b,t,c)=>b?'<span class="tg '+c+'">'+t+'<\/span>':"";
  const link=n=>{const t=s.f.find(z=>z.n.toLowerCase()===n.toLowerCase());return t?'<a class="lnk mono" data-go="#/screen/'+s.id+'/fields/'+enc(t.n)+'">'+esc(n)+'<\/a>':'<span class="mono">'+esc(n)+'<\/span>';};
  let h='<div class="dh"><div style="flex:1;min-width:0"><small>'+esc(s.cap)+' · '+esc(x.dc||"")+(dc.cap?" · "+esc(dc.cap):"")+'<\/small><h3>'+esc(x.cap||x.n)+'<\/h3><small>'+esc(x.n)+'<\/small><div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:10px">'+
    flag(x.hid,"HIDDEN","tg-hid")+flag(x.ro,"READ-ONLY","tg-ro")+flag(x.req,"MANDATORY","tg-req")+flag(x.nodup,"UNIQUE","tg-uq")+flag(x.ex||x.vx,"FX","tg-fx")+(!x.hid&&!x.ro?'<span class="tg" style="background:var(--greenb);color:var(--green)">EDITABLE<\/span>':"")+'<\/div><\/div>'+
    '<button class="ib" id="cpf" title="Copy field name">'+ico("copy")+'<\/button><button class="ib" id="dclose" title="Close (Esc)">'+ico("close")+'<\/button><\/div><div class="db">';
  h+='<dl class="kv"><dt>Mode of entry<\/dt><dd>'+esc(x.m||"–")+'<\/dd><dt>Data type<\/dt><dd class="mono">'+esc((x.ty||"")+(x.w?" ("+x.w+")":""))+'<\/dd><dt>Data container<\/dt><dd>'+esc(x.dc||"")+(dc.grid?' <span class="tg tg-uq">GRID<\/span>':"")+'<\/dd>'+
     '<dt>Saved to<\/dt><dd class="mono">'+esc((x.tbl||dc.tbl||"–")+"."+x.n)+'<\/dd><dt>Order in DC<\/dt><dd>'+esc(x.o)+'<\/dd>'+(x.src?'<dt>Source<\/dt><dd class="mono">'+esc(x.src)+'<\/dd>':"")+(x.par?'<dt>Parent fields<\/dt><dd class="mono">'+esc(x.par)+'<\/dd>':"")+'<\/dl>';
  if(x.ex)h+='<div class="sec">Expression<\/div><pre class="code">'+esc(x.ex)+'<\/pre>';
  if(x.vx)h+='<div class="sec">Validation<\/div><pre class="code">'+esc(x.vx)+'<\/pre>';
  if(x.lst)h+='<div class="sec">List values<\/div><div style="display:flex;gap:6px;flex-wrap:wrap">'+x.lst.split("|").map(v=>'<span class="st st-grey">'+esc(v)+'<\/span>').join("")+'<\/div>';
  h+='<div class="sec">Connections<\/div><dl class="kv"><dt>Recalculates<\/dt><dd>'+(x.dep?x.dep.split(/[,\s]+/).filter(Boolean).map(link).join(", "):"–")+'<\/dd><dt>Recalculated by<\/dt><dd>'+(drivenBy.length?drivenBy.map(link).join(", "):"–")+'<\/dd><dt>Used in formula of<\/dt><dd>'+(usedIn.length?usedIn.map(link).join(", "):"–")+'<\/dd><\/dl>';
  const ctl=(s.cancel||[]).concat(s.remove||[]).filter(r=>(r.control_field||"").toLowerCase()===nm);
  if(ctl.length)h+='<div class="sec">Button control<\/div><div class="note">'+ico("warn")+'<div>This field drives <b>'+ctl.length+'<\/b> Cancel / Remove rule(s): '+esc([...new Set(ctl.map(r=>r.mechanism||""))].join(", "))+'<\/div><\/div>';
  const fh=s.find.filter(f=>f.where.toLowerCase().startsWith("field "+nm+" "));
  if(fh.length)h+='<div class="sec">Hard-coded<\/div>'+fh.map(f=>'<div class="note">'+ico("code")+'<div><b>'+esc(f.kind)+'<\/b> in '+esc(f.where)+': <code class="mono">'+esc(f.hit)+'<\/code><\/div><\/div>').join("");
  const rr=Object.entries(s.roles).filter(([r,a])=>(a.rules||[]).some(z=>z.n.toLowerCase()===nm));
  if(rr.length)h+='<div class="sec">Role-level rules<\/div>'+rr.map(([r,a])=>'<div class="note blue">'+ico("lock")+'<div>Role <b>'+esc(r)+'<\/b>: '+esc(rulesTxt(a.rules.filter(z=>z.n.toLowerCase()===nm)))+'<\/div><\/div>').join("");
  h+='<\/div>';
  $("#drawer").innerHTML=h;openDrawer();
  $("#dclose").onclick=()=>go("#/screen/"+s.id+"/fields");
  $("#cpf").onclick=()=>copy(x.n,x.n);
  bindGo($("#drawer"));
}

function ruleCard(x,kind){
  const has=kind==="Cancel"?x.has_cancel:x.has_remove_button,ctl=kind==="Cancel"?x.cancel_control:x.remove_control;
  const st=has!=="Yes"?["st-grey","No "+kind+" button"]:ctl==="Yes"?["st-green","Controlled"]:ctl==="TBC"?["st-amber","To be tested"]:["st-red","Not controlled"];
  return '<div class="rule"><div class="hd"><span class="st '+st[0]+'">'+st[1]+'<\/span>'+(x.mechanism?'<b>'+esc(x.mechanism)+'<\/b>':"")+(x.source?'<span class="st st-grey">'+esc(x.source)+'<\/span>':"")+'<span class="mono dim" style="margin-left:auto;font-size:12px">'+esc(x.page_name||"")+'<\/span><\/div>'+

}

let mxMode="t";
function vMatrix(){
  let h='<div class="ph"><div><h1>Access matrix<\/h1><p>Every role against every screen of '+esc(M.module)+', grouped by menu folder. Hover or tap a cell; click opens that screen. On a phone, scroll the grid sideways.<\/p><\/div><\/div>';
  h+='<div class="tool"><div class="chips"><button class="chip'+(mxMode==="t"?" on":"")+'" data-m="t">Forms <span class="n">'+forms.length+'<\/span><\/button><button class="chip'+(mxMode==="all"?" on":"")+'" data-m="all">Forms + reports <span class="n">'+S.filter(s=>s.k!=="p").length+'<\/span><\/button><\/div>'+
    '<div class="legend" style="margin:0"><span><i class="sw" style="background:var(--blue)"><\/i>Menu + screen<\/span><span><i class="sw" style="background:var(--teal)"><\/i>Screen only<\/span><span><i class="sw" style="background:var(--amber)"><\/i>Menu only<\/span><span><i class="sw" style="background:var(--surf2);outline:1px solid var(--line2)"><\/i>No access<\/span><\/div><\/div>';
  h+='<section class="card"><div class="mxwrap" id="mxw"><canvas id="mx"><\/canvas><\/div><\/section>';
  $("#view").innerHTML=h;
  $$(".chip[data-m]").forEach(b=>b.onclick=()=>{mxMode=b.dataset.m;vMatrix();});
  drawMatrix();
}
function drawMatrix(){
  const cv=$("#mx");if(!cv||!S)return;
  const cols=S.filter(s=>mxMode==="t"?s.k==="t":s.k!=="p").sort((a,b)=>a.folder.localeCompare(b.folder)||a.cap.localeCompare(b.cap));
  const rows=Object.keys(R).map(r=>({r,n:cols.filter(s=>s.roles[r]).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n||a.r.localeCompare(b.r));
  const small=innerWidth<700,cell=small?14:12,gap=2,LW=small?130:200,TH=small?130:160,dpr=window.devicePixelRatio||1,st=cell+gap;
  const W=LW+cols.length*st+30,Hh=TH+rows.length*st+12;
  cv.width=W*dpr;cv.height=Hh*dpr;cv.style.width=W+"px";cv.style.height=Hh+"px";
  const g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);
  const C={blue:css("--blue"),teal:css("--teal"),amber:css("--amber"),e:css("--surf2"),ink:css("--ink"),ink3:css("--ink3"),line2:css("--line2")};
  const font=css("--font");g.textBaseline="middle";
  let i0=0,b=0;while(i0<cols.length){let i1=i0;while(i1<cols.length&&cols[i1].folder===cols[i0].folder)i1++;g.fillStyle=b++%2?C.line2:C.blue;g.fillRect(LW+i0*st,TH-8,(i1-i0)*st-gap,4);i0=i1;}
  const cut=(t,n)=>t.length>n?t.slice(0,n-1)+"…":t;
  cols.forEach((s,i)=>{g.save();g.translate(LW+i*st+cell/2+3,TH-14);g.rotate(-Math.PI/3);g.fillStyle=C.ink3;g.font="11px "+font;g.fillText(cut(s.cap,small?18:26),0,0);g.restore();});
  rows.forEach((row,j)=>{const y=TH+j*st;g.fillStyle=C.ink;g.font="12px "+font;g.textAlign="right";g.fillText(cut(row.r,small?15:24),LW-36,y+cell/2);
    g.fillStyle=C.ink3;g.font="11px "+css("--mono");g.fillText(row.n,LW-10,y+cell/2);g.textAlign="left";
    cols.forEach((s,i)=>{const a=s.roles[row.r];g.fillStyle=!a?C.e:a.menu&&a.obj?C.blue:a.obj?C.teal:C.amber;g.beginPath();
      if(g.roundRect)g.roundRect(LW+i*st,y,cell,cell,3);else g.rect(LW+i*st,y,cell,cell);g.fill();});});
  const tip=$("#tip");let lastTap=null;
  const hit=e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,i=Math.floor((x-LW)/st),j=Math.floor((y-TH)/st);
    return (x>=LW&&y>=TH&&i>=0&&j>=0&&i<cols.length&&j<rows.length)?{s:cols[i],r:rows[j].r}:null;};
  const show=(e,h)=>{const a=h.s.roles[h.r];tip.innerHTML='<b>'+esc(h.r)+'<\/b> → <b>'+esc(h.s.cap)+'<\/b><br>'+(a?(a.menu&&a.obj?"Menu + screen access":a.obj?"Screen access, no menu entry":"Menu entry, no screen access"):"No access")+'<br>'+liveUsers(h.r).length+' people in role · '+esc(h.s.folder)+(e.pointerType==="touch"?'<br><i>tap again to open<\/i>':"");
    tip.style.left=Math.max(8,Math.min(e.clientX+14,innerWidth-330))+"px";tip.style.top=(e.clientY+14)+"px";tip.classList.add("on");};

function accessPath(u,live,fm){
  if(!live.length||!fm.length)return'<div class="empty">'+ico("info")+'No form reachable.<\/div>';
  const rowH=26,top=10,W=1000,x0=10,x1=330,x2=640,nw=240,n=Math.max(fm.length,live.length),H2=top*2+n*rowH;
  const ry=i=>top+(i+.5)*(H2-top*2)/live.length, fy=i=>top+(i+.5)*(H2-top*2)/fm.length;
  const pY=H2/2;let e="",nd="";
  live.forEach((r,i)=>{e+='<path class="edge" data-r="'+esc(r)+'" d="M'+(x0+210)+' '+pY+' C'+(x0+270)+' '+pY+' '+(x1-60)+' '+ry(i)+' '+x1+' '+ry(i)+'"/>';});
  fm.forEach((s,j)=>live.forEach((r,i)=>{if(s.roles[r])e+='<path class="edge" data-r="'+esc(r)+'" d="M'+(x1+nw)+' '+ry(i)+' C'+(x1+nw+60)+' '+ry(i)+' '+(x2-60)+' '+fy(j)+' '+x2+' '+fy(j)+'"/>';}));
  nd+='<g class="nd"><rect x="'+x0+'" y="'+(pY-18)+'" width="210" height="36" rx="18" style="fill:'+avc(u)+';stroke:none"/><text x="'+(x0+105)+'" y="'+(pY+4)+'" text-anchor="middle" style="fill:#fff;font-weight:500">'+esc((U[u].nm||u).slice(0,28))+'<\/text><\/g>';
  live.forEach((r,i)=>{nd+='<g class="nd role" data-r="'+esc(r)+'" data-href="#/role/'+esc(enc(r))+'"><rect x="'+x1+'" y="'+(ry(i)-12)+'" width="'+nw+'" height="24" rx="12"/><text x="'+(x1+14)+'" y="'+(ry(i)+4)+'">'+esc(r.slice(0,30))+'<\/text><\/g>';});
  fm.forEach((s,j)=>{const c=s.rs.key==="open"?"var(--red)":s.cs.key==="tbc"?"var(--amber)":"var(--green)";
    nd+='<g class="nd scr" data-href="#/screen/'+s.id+'"><rect x="'+x2+'" y="'+(fy(j)-11)+'" width="'+(W-x2-10)+'" height="22" rx="6"/><circle cx="'+(x2+12)+'" cy="'+fy(j)+'" r="4" fill="'+c+'"/><text x="'+(x2+24)+'" y="'+(fy(j)+4)+'">'+esc(s.cap.slice(0,42))+'<\/text><title>'+esc(s.cap+" · Cancel: "+s.cs.v+" · Remove: "+s.rs.v)+'<\/title><\/g>';});
  return '<div class="path" style="overflow-x:auto"><svg viewBox="0 0 '+W+' '+H2+'" style="min-width:760px">'+e+nd+'<\/svg><\/div><div class="legend"><span><i class="sw" style="background:var(--green)"><\/i>Buttons controlled or none<\/span><span><i class="sw" style="background:var(--amber)"><\/i>Cancel to be tested<\/span><span><i class="sw" style="background:var(--red)"><\/i>Remove open<\/span><\/div>';
}

function gx4(r,g){
  const f=r.f?'<code class="mono">'+esc(r.f)+'<\/code>':"", tb=(r.tb||[]).filter(Boolean), T=tb.length?'<code class="mono">'+esc(tb.join(", "))+'<\/code>':"the tables below";

  let a=[];
  if(r.w==="field"&&/empty/.test(r.t))a=["Field property <b>Allow empty = No<\/b> on "+f+".","The record means nothing without it.","Fill it. If it is greyed out, its value comes from another field: fill that one first.","Save moves on to the next check."];
  else if(r.w==="field"&&/unique/.test(r.t))a=["Field property <b>Allow duplicate = No<\/b> on "+f+".","Stops the same value being saved twice (for example the same item twice in one grid).","Find the row that already has this value and change that row.","Save moves on."];
  else if(r.w==="field"&&/list comes from SQL/.test(r.t))a=["The SQL of field "+f+", reading "+T+".","So the user can only pick valid, active, permitted values.","<b>Not in list / empty list<\/b> = this SQL returned no row"+PV+". Check the conditions below one by one against the row in "+T+": the first one that fails is the reason.","Once the source row satisfies every condition it appears. No code change."];
  else if(r.w==="field"&&r.k==="VALIDATION")a=["Validation of field "+f+(tb.length?", reading "+T:"")+".","A business rule enforced while typing.",(r.m?"The message shows when the condition is false. ":"")+"Change the input"+(P.length?" ("+esc(P.slice(0,4).join(", "))+")":"")+" until the condition is true. If the rule itself is wrong, that is a structure change: TEST first.","The value is accepted and the fields that use it recalculate."];
  else if(r.w==="field")a=["Expression / SQL of field "+f+".","The value is derived so nobody types it wrong.","If it looks wrong, check its inputs"+(P.length?" ("+esc(P.slice(0,5).join(", "))+")":"")+", not this field.","Every field that uses it recalculates."];
  else if(r.w==="save"&&r.k==="VALIDATION")a=["Save control field "+f+".","The last gate before anything is written.","The message names the condition. Fix the data it checks"+(tb.length?" in "+T:"")+", then Save again.","The record and its genmap / mdmap rows are written."];
  else if(r.w==="delete"&&r.k==="VALIDATION")a=["Delete control field "+f+", counting rows in "+T+".","Blocks Cancel / Remove once later documents depend on this one.","Find the rows it counts (conditions below)"+PV+". Undo those later documents first. Never delete them straight in the database.","Cancel runs: genmap rows are taken back, mdmap values reduced."];
  else if(r.w==="delete")a=["Structure settings.","Not a rule: a gap the scan noticed.","Before cancelling, check by hand which later documents used this one.","Without a guard, Cancel goes through even if later documents still point at it."];
  else if(r.w==="save"&&r.k==="FLOW")a=["Genmap / mdmap of this structure, writing "+T+".","So stock, accounts or balances update without a second entry.","If "+T+" looks wrong, compare it with this document's grid using the mapping below.","Cancel reverses exactly these rows."];
  else if(r.w==="fillgrid")a=["Fill grid SQL, reading "+T+".","Brings rows in so the user does not type them.","Missing or wrong rows = run the SQL in Toad"+PV+" and check the conditions below.","Values are copied at fill time. Save does not re-read them."];
  else if(r.w==="action")a=["Action in the structure"+(tb.length?", touching "+T:"")+".","An extra step bound to an event or a button.",r.k==="CHECK"?"It writes directly, so Cancel does not reverse it on its own. Check how this row is undone.":"Nothing to fix unless the step misbehaves.","Runs every time its event fires."];
  else if(r.w==="db")a=["Oracle trigger on "+T+".","Enforced even outside the screen.",/disabled/.test(r.t)?"Disabled: it does nothing today. Do not rely on it.":"The trigger raises the message: fix the data condition it tests.","The statement completes, or is rolled back with the message."];
  if(!a.length)return"";

}

    st("Field checks","Validated while typing. These are the messages a user can see.",ids(R.filter(r=>r.w==="field"&&r.k==="VALIDATION")));
    st("Save control",g.settings.save?"Last gate before writing.":"No save control: nothing stops Save at structure level.",ids(R.filter(r=>r.w==="save"&&r.k!=="FLOW")));
    st("Written","The record goes into "+own+". Genmap / mdmap then write into other tables.",ids(R.filter(r=>r.w==="save"&&r.k==="FLOW")));
    st("Inside Oracle","Triggers on those tables run now, outside Axpert.",ids(R.filter(r=>r.w==="db")));
    st("After save","Actions bound to 'After save transaction'.",ids(R.filter(r=>r.w==="action"&&/after save/i.test(r.t))));
  }else{
    st("Delete control",g.settings.delete?"Runs first. If it returns a message, Cancel / Remove stops here.":"No delete control: Cancel / Remove is not guarded.",ids(R.filter(r=>r.w==="delete")));
    st("Cancel action","Cancel steps defined in the structure.",ids(R.filter(r=>r.w==="action"&&/cancel/i.test(r.t))));
    st("Reverse what Save wrote","Every genmap row is taken back, every mdmap value reduced.",ids(R.filter(r=>r.w==="save"&&r.k==="FLOW")));
    st("Inside Oracle","Triggers run on the reversal too (for example the negative stock check).",ids(R.filter(r=>r.w==="db")));
  }
  return S;
}

/* ---------- the Galaxy tab of one screen ---------- */
function scGalaxy(s,body){
  body.innerHTML='<div class="loading"><div class="spin"><\/div>Loading Galaxy…<\/div>';
  const n=s.n.toLowerCase();
  gxLoad(n,"data/gx/"+n+".js").then(()=>gxRender(s,body,GXD.scr[n]),()=>{body.innerHTML='<div class="empty">'+ico("info")+'No Galaxy data for <code class="mono">'+esc(s.n)+'<\/code> yet. On the server run <code class="mono">python galaxy\\build_gx.py '+esc(n)+'<\/code>.<\/div>';});
}
function gxRender(s,body,g){
  if(!GXSK[g.t]){GXSK[g.t]="seen";gxSkSave();}
  const R=g.rules.map((r,i)=>Object.assign(r,{i})),c={FLOW:0,VALIDATION:0,CHECK:0};R.forEach(r=>c[r.k]++);
  const u=g.usage||{},own=[...new Set(g.dcs.map(d=>d.tb).filter(Boolean))],wr=[...new Set(g.maps.map(m=>m.table).filter(Boolean))];
  const chk=R.filter(r=>r.k==="CHECK");
  const msg=sessionStorage.getItem("gx-msg");if(msg){sessionStorage.removeItem("gx-msg");const hit=R.find(r=>(r.m||"").includes(msg));if(hit)GXS.open=hit.i;}
  let h='<div class="kpis">'+kpi("ok","var(--green)","Flow",c.FLOW,"what normally happens","")+kpi("warn","var(--amber)","Validation",c.VALIDATION,"can stop the user","")+kpi("health","var(--red)","Check",c.CHECK,"look here first","")+
    (u.docs12!=null?kpi("form","var(--blue)","Documents",u.docs12,(u.cancel12||0)+" cancelled · 12 months",""):"")+kpi("apps","var(--purple)","Read by",g.readers.length,"other screens use its data","")+'<\/div>';
  h+=card(ico("orbit")+"The screen in 3 layers","Screen → logic → tables. Blue line = saves into, green = also writes on Save, red = reversed on Cancel / trigger. Tap a block.",gxLayers(g,R));
  h+='<div style="height:16px"><\/div><div class="bento"><div class="c12">'+
    card("In one minute","Generated "+esc(g.built)+" from the live structure",
      '<p class="gxp1">Saves into <b>'+esc(own.join(", ")||"–")+'<\/b>.'+(wr.length?' On Save it also writes <b>'+esc(wr.join(", "))+'<\/b>, so Cancel must take those back.':' It writes nothing into other screens.')+'<\/p>'+
      '<p class="gxp1">'+(g.settings.save?'Save is guarded by <code class="mono">'+esc(g.settings.save)+'<\/code>. ':'<b>No save control.<\/b> ')+(g.settings.delete?'Cancel / Remove is guarded by <code class="mono">'+esc(g.settings.delete)+'<\/code>.':'<b>Nothing guards Cancel / Remove.<\/b>')+'<\/p>'+
      (chk.length?'<div class="sec">Look here first when it goes wrong<\/div>'+chk.map(r=>'<button class="gxq" data-r="'+r.i+'"><span class="st st-red">Check<\/span>'+esc(r.t)+'<\/button>').join(""):'')+
      '<div class="sec">Your understanding<\/div><div class="tool" style="margin:0"><button class="btn'+(GXSK[g.t]==="ok"?" pri":"")+'" data-sk="ok">'+ico("ok")+'I understand it<\/button><button class="btn'+(GXSK[g.t]==="no"?" pri":"")+'" data-sk="no">Not clear yet<\/button><\/div>')+'<\/div><\/div>';
  h+='<div style="height:16px"><\/div><section class="card"><div class="ch"><h3>How it works<\/h3><div class="hint">Every rule of this screen, grouped by <b>when<\/b> it runs. Tap one for where it comes from, why, how to handle it and what happens after.<\/div><\/div><div class="cb">'+
    '<div class="tool gxtool">'+Object.keys(GXK).map(k=>'<button class="chip'+(GXS.show[k]?" on":"")+'" data-k="'+k+'"><span class="st '+GXK[k][0]+'">'+GXK[k][1]+'<\/span>'+c[k]+'<\/button>').join("")+
      '<input class="gxin" id="gxq" placeholder="Filter rules or paste an error message" value="'+esc(GXS.q)+'">'+
      '<button class="btn" data-walk="save">▶ Walk: Save<\/button><button class="btn" data-walk="cancel">▶ Walk: Cancel<\/button><\/div><div id="gxwalk"><\/div><div id="gxlist"><\/div><\/div><\/section>';
  h+='<div style="height:16px"><\/div><div class="bento"><div class="c6">'+card("Other screens that read its data",g.readers.length+" screens · if a value here is wrong, they show it wrong too",gxScreens(g.readers))+'<\/div><div class="c6">'+
    card("Screens that write into it",g.writers.length+" via genmap / mdmap",gxScreens(g.writers))+'<\/div><\/div>';
  body.innerHTML=h;countUp(body);bindGo(body);
  const list=()=>gxList(g,R,gq("#gxlist",body));
  $$(".chip[data-k]",body).forEach(b=>b.onclick=()=>{GXS.show[b.dataset.k]=!GXS.show[b.dataset.k];b.classList.toggle("on");list();});
  gq("#gxq",body).oninput=e=>{GXS.q=e.target.value;GXS.walk=null;gq("#gxwalk",body).innerHTML="";list();};
  $$("[data-sk]",body).forEach(b=>b.onclick=()=>{GXSK[g.t]=b.dataset.sk;gxSkSave();gxRender(s,body,g);toast("Saved on this browser");});
  $$("[data-walk]",body).forEach(b=>b.onclick=()=>{const S=gxWalk(g,R,b.dataset.walk);if(!S.length)return;GXS.walk={k:b.dataset.walk,S,i:0};gxWalkDraw(g,R,body);});
  $$(".gxq",body).forEach(b=>b.onclick=()=>{GXS.open=+b.dataset.r;GXS.walk=null;list();gxScrollOpen(body);});
  $$(".gxch",body).forEach(e=>e.onclick=()=>{const v=e.dataset.gx;GXS.walk=null;gq("#gxwalk",body).innerHTML="";
    if(v.startsWith("w:")){const w=v.slice(2);GXS.q="";GXS.open=null;list();const sec=gq('[data-sec="'+w+'"]',body);sec&&sec.scrollIntoView({behavior:"smooth",block:"start"});}
    else{GXS.q=v.slice(v.indexOf(":")+1);gq("#gxq",body).value=GXS.q;list();gq("#gxlist",body).scrollIntoView({behavior:"smooth",block:"start"});}});
  list();
  if(GXS.open!=null)gxScrollOpen(body);
}
function gxScrollOpen(body){requestAnimationFrame(()=>{const e=gq(".gxr.open",body);e&&e.scrollIntoView({behavior:"smooth",block:"center"});});}
function gxScreens(L){
  if(!L.length)return'<div class="dim" style="font-size:13px">None<\/div>';
  return '<div class="gxsl">'+L.map(x=>{const id="t:"+x[0],here=SID[id];return '<'+(here?'a class="lnk" data-go="#/screen/'+esc(id)+'/galaxy"':'span')+'>'+esc(x[1]||x[0])+' <small class="mono">'+esc(x[0])+(x[2]?" · "+esc(x[3]+" "+x[2]):"")+'<\/small><\/'+(here?"a":"span")+'>';}).join("")+'<\/div>';
}
function gxList(g,R,el){
  const q=GXS.q.trim().toLowerCase(),lit=GXS.walk?new Set(GXS.walk.S[GXS.walk.i].ids):null;
  const hit=r=>!q||[r.t,r.m,r.c,r.f,(r.tb||[]).join(" ")].join(" ").toLowerCase().includes(q);
  let h="";
  GXW.forEach(w=>{
    const rs=R.filter(r=>r.w===w[0]&&(lit?lit.has(r.i):GXS.show[r.k]&&hit(r)));if(!rs.length)return;
    h+='<div class="gxsec" data-sec="'+w[0]+'"><div class="gxsh"><b>'+w[1]+'<\/b><span>'+w[2]+' · '+rs.length+'<\/span><\/div>'+rs.map(r=>{
      const o=GXS.open===r.i;
      return '<div class="gxr'+(o?" open":"")+(lit?" lit":"")+'" data-i="'+r.i+'"><button class="gxrh"><span class="st '+GXK[r.k][0]+'">'+GXK[r.k][1]+'<\/span><span class="gxt">'+esc(r.t)+(r.m?'<small>“'+esc(r.m.split(" | ")[0])+'”<\/small>':"")+'<\/span>'+ico("chev")+'<\/button>'+
        (o?'<div class="gxrb">'+(r.m?r.m.split(" | ").map(m=>'<div class="note">'+ico("warn")+'<div><b>User sees:<\/b> “'+esc(m)+'”<\/div><\/div>').join(""):"")+'<p>'+esc(r.s)+'<\/p>'+gx4(r,g)+gxCond(r)+gxParams(r)+
          (r.c?'<div class="sec">The real code<\/div><div class="code-wrap"><pre class="code">'+esc(r.c)+'<\/pre><\/div>':"")+(r.tb&&r.tb.length?'<div class="sec">Tables<\/div><div class="rl">'+r.tb.map(t=>'<span class="st st-teal">'+esc(t)+'<\/span>').join("")+'<\/div>':"")+'<\/div>':"")+'<\/div>';}).join("")+'<\/div>';
  });
  el.innerHTML=h||'<div class="empty">'+ico("info")+'Nothing matches. If this is a new error message, ask in chat: it gets traced and added.<\/div>';
  $$(".gxrh",el).forEach(b=>b.onclick=()=>{const i=+b.parentNode.dataset.i;GXS.open=GXS.open===i?null:i;gxList(g,R,el);});
}
function gxWalkDraw(g,R,body){
  const w=GXS.walk,s=w.S[w.i];GXS.open=null;
  gq("#gxwalk",body).innerHTML='<div class="gxwalk"><div><small>Walk: '+(w.k==="save"?"Save":"Cancel / Remove")+' · step '+(w.i+1)+' of '+w.S.length+'<\/small><b>'+esc(s.t)+'<\/b><p>'+esc(s.x)+'<\/p><\/div><div class="gxwb"><button class="btn" id="gxp">←<\/button><button class="btn pri" id="gxn">'+(w.i<w.S.length-1?"Next →":"Done")+'<\/button><button class="btn" id="gxx">Stop<\/button><\/div><\/div>';
  gq("#gxp",body).onclick=()=>{if(w.i>0){w.i--;gxWalkDraw(g,R,body);}};
  gq("#gxn",body).onclick=()=>{if(w.i<w.S.length-1){w.i++;gxWalkDraw(g,R,body);}else{GXS.walk=null;gq("#gxwalk",body).innerHTML="";gxList(g,R,gq("#gxlist",body));}};
  gq("#gxx",body).onclick=()=>{GXS.walk=null;gq("#gxwalk",body).innerHTML="";gxList(g,R,gq("#gxlist",body));};
  gxList(g,R,gq("#gxlist",body));gq("#gxwalk",body).scrollIntoView({behavior:"smooth",block:"start"});
}

/* ---------- module page: what matters most ---------- */
const GXCAT=[["nodel","No delete control",/No delete \/ cancel control/i],["nocancel","Delete control ignores CANCEL",/no CANCEL filter/i],["wnodel","Writes elsewhere, no delete control",/Writes to other tables but has no delete/i],
  ["direct","Action writes directly (firesql)",/firesql|directly/i],["trigoff","Disabled trigger",/trigger.*disabled/i],["users","Hard-coded user IDs",/Hard-coded user/i],["nosave","No save control",/No save control/i]];
let gxF={cat:"",q:""};
function vGalaxy(){
  $("#view").innerHTML='<div class="loading"><div class="spin"><\/div>Loading Galaxy…<\/div>';
  gxLoad("__idx","data/gx_index.js").then(vGalaxyDraw,()=>{$("#view").innerHTML='<div class="empty">'+ico("info")+'No Galaxy index yet. Run <code class="mono">python galaxy\\build_gx.py all<\/code>.<\/div>';});
}
function vGalaxyDraw(){
  const L=GXD.idx.screens.filter(x=>x.mod===M.module&&SID["t:"+x.t]);
  L.forEach(x=>{x.cats=GXCAT.filter(c=>(x.chk||[]).some(t=>c[2].test(t))).map(c=>c[0]);x.score=((x.chk||[]).length-(x.cats.includes("nosave")?1:0))*Math.log10(10+(x.docs12||0));});
  const ok=L.filter(x=>GXSK[x.t]==="ok").length,no=L.filter(x=>GXSK[x.t]==="no").length,seen=L.filter(x=>GXSK[x.t]).length;
  const msgs=L.reduce((a,x)=>a+(x.msgs||[]).length,0),checks=L.reduce((a,x)=>a+(x.n.CHECK||0),0);
  let h='<div class="ph"><div><h1>Galaxy<\/h1><p>How the '+esc(M.module)+' screens really work, from the live structures. Start with the screens at the top: they are used most and have the most weak points.<\/p><\/div><\/div>';
  h+='<div class="kpis">'+kpi("orbit","var(--blue)","Screens explained",L.length,"every form of this module","")+kpi("health","var(--red)","Weak points",checks,"CHECK items to look at first","")+
    kpi("warn","var(--amber)","Error messages",msgs,"searchable below","")+kpi("ok","var(--green)","You understand",ok,no+" not clear · "+seen+" opened","")+'<\/div>';
  h+='<div class="bento"><div class="c7">'+card(ico("warn")+"Find an error message","Paste what the user saw: you get the screen and the exact rule",'<input class="gxin big" id="gxm" placeholder="e.g. Stock Will Go Negative" value="'+esc(gxF.q)+'"><div id="gxmr"><\/div>')+'<\/div><div class="c5">'+
    card("Weak points by type","Tap a bar to filter the list",hbars(GXCAT.map(c=>({l:c[1],v:L.filter(x=>x.cats.includes(c[0])).length,c:c[0]==="nosave"?"var(--grey)":"var(--red)",go:"gxcat:"+c[0]}))))+'<\/div><\/div>';
  const F=L.filter(x=>!gxF.cat||x.cats.includes(gxF.cat)).sort((a,b)=>b.score-a.score);
  h+='<div style="height:16px"><\/div><section class="card"><div class="ch"><h3>Look here first<\/h3><div class="hint">'+(gxF.cat?'Filter: <b>'+esc(GXCAT.find(c=>c[0]===gxF.cat)[1])+'<\/b> · <a class="lnk" id="gxclr">clear<\/a> · ':"")+'ranked by weak points × documents in 12 months<\/div><\/div><div class="cb">'+
    table("gx",[{h:"Screen",k:x=>(x.cap||"").toLowerCase(),r:x=>'<b>'+esc(x.cap)+'<\/b><span class="sub mono">'+esc(x.t)+'<\/span>'},
      {h:"Docs / 12 m",num:1,k:x=>x.docs12||0,r:x=>x.docs12==null?'<span class="dim">–<\/span>':fmt(x.docs12)},
      {h:"Flow",num:1,k:x=>x.n.FLOW,r:x=>x.n.FLOW},{h:"Validation",num:1,k:x=>x.n.VALIDATION,r:x=>x.n.VALIDATION},
      {h:"Weak points",k:x=>x.score,r:x=>'<div class="rl">'+x.cats.map(c=>'<span class="st '+(c==="nosave"?"st-grey":"st-red")+'">'+esc(GXCAT.find(z=>z[0]===c)[1])+'<\/span>').join("")+'<\/div>'},
      {h:"You",k:x=>GXSK[x.t]||"",r:x=>GXSK[x.t]==="ok"?'<span class="st st-green">understood<\/span>':GXSK[x.t]==="no"?'<span class="st st-amber">not clear<\/span>':GXSK[x.t]?'<span class="st st-grey">opened<\/span>':""}],
      F,{sort:4,go:x=>"#/screen/t:"+x.t+"/galaxy",lim:500})+'<\/div><\/section>';
  $("#view").innerHTML=h;
  $$("[data-go^='gxcat:']",$("#view")).forEach(e=>{e._g=1;e.style.cursor="pointer";e.onclick=()=>{gxF.cat=e.dataset.go.slice(6);vGalaxyDraw();};});
  countUp($("#view"));bindTables($("#view"),vGalaxyDraw);
  if($("#gxclr"))$("#gxclr").onclick=()=>{gxF.cat="";vGalaxyDraw();};
  const mr=()=>{const q=gxF.q.trim().toLowerCase(),out=[];
    if(q.length>2)GXD.idx.screens.forEach(x=>(x.msgs||[]).forEach(m=>{if(m.toLowerCase().includes(q))out.push([x,m]);}));
    $("#gxmr").innerHTML=q.length<3?'<div class="dim" style="font-size:13px;margin-top:10px">Searches every module, not only '+esc(M.module)+'.<\/div>':out.length?'<div class="gxsl" style="margin-top:10px">'+out.slice(0,30).map(([x,m],i)=>'<a class="lnk" data-m="'+i+'">“'+esc(m)+'”<small>'+esc(x.cap)+' · '+esc(x.mod)+'<\/small><\/a>').join("")+'<\/div>':'<div class="dim" style="font-size:13px;margin-top:10px">Not found in any structure. It may come from a procedure or the Android app: ask in chat.<\/div>';
    $$("[data-m]",$("#gxmr")).forEach(a=>a.onclick=()=>{const [x,m]=out[+a.dataset.m];sessionStorage.setItem("gx-msg",m);GXS.open=null;
      const mod=(ATLAS.mods.find(z=>z.name===x.mod)||{}).slug||CUR;location.hash="#/"+mod+"/screen/t:"+x.t+"/galaxy";});};
  $("#gxm").oninput=e=>{gxF.q=e.target.value;mr();};mr();
}

</script>
