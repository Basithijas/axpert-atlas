<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Axpert Galaxy</title>
<style>
:root{
  --bg:#08080a; --bg2:#0d0d10; --panel:#111115; --panel2:#15151a;
  --line:#232329; --line2:#2e2e36;
  --ink:#ececf0; --dim:#8b8b96; --dim2:#5f5f6a;
  --red:#e5484d; --amber:#f5a524; --green:#30a46c;
  --indigo:#6e6ade; --violet:#a66ad6; --grey:#7c7c88;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
  --sans:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  --cc:#6e6ade;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased}
a{color:inherit}
#app{display:flex;flex-direction:column;height:100%}

/* ---------- bar ---------- */
.bar{display:flex;align-items:center;gap:12px;padding:11px 16px;
  border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:4px}
.brand b{font-size:15px;font-weight:800;letter-spacing:-.02em}
.brand i{font-style:normal;font:10px var(--mono);letter-spacing:.2em;
  text-transform:uppercase;color:var(--dim2)}
.sp{flex:1}
.ib{background:var(--panel);border:1px solid var(--line2);color:var(--dim);
  font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;
  padding:8px 12px;cursor:pointer;border-radius:2px;transition:.12s;white-space:nowrap}
.ib:hover{color:var(--ink);border-color:var(--dim2)}
.ib.on{background:var(--ink);color:#08080a;border-color:var(--ink);font-weight:700}
.ib[disabled]{opacity:.35;cursor:default}
#q{background:var(--panel);border:1px solid var(--line2);color:var(--ink);
  font:13px var(--sans);padding:8px 12px;border-radius:2px;outline:0;width:230px}
#q:focus{border-color:var(--dim2)}
.sw{position:relative}
.sug{position:absolute;top:38px;left:0;width:330px;background:#0b0b0e;
  border:1px solid var(--line2);max-height:320px;overflow:auto;z-index:40;display:none}
.sug button{display:block;width:100%;text-align:left;background:none;border:0;
  color:var(--ink);padding:9px 12px;cursor:pointer;font:13px var(--sans);
  border-bottom:1px solid var(--line)}
.sug button:hover{background:var(--panel2)}
.sug em{font-style:normal;font:10.5px var(--mono);color:var(--dim2);display:block;margin-top:2px}

/* ---------- stage ---------- */
.stage{flex:1;position:relative;min-height:0}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
.tip{position:absolute;pointer-events:none;background:#000;border:1px solid var(--line2);
  padding:6px 9px;font:12px var(--sans);display:none;z-index:9;max-width:240px}
.tip b{display:block;font:10.5px var(--mono);color:var(--dim);font-weight:400;margin-top:3px}

.card{position:absolute;left:16px;bottom:16px;width:min(420px,calc(100% - 32px));
  background:rgba(11,11,14,.94);border:1px solid var(--line2);border-left:2px solid var(--cc);
  padding:16px 18px;max-height:calc(100% - 110px);overflow:auto}
.card .k{font:10px var(--mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim2);margin-bottom:7px}
.card h3{font-size:18px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px;line-height:1.2}
.card p{margin:0;font-size:14px;line-height:1.6;color:#d4d4dd}
.card p b{color:var(--ink);font-weight:600}
.card code{font-family:var(--mono);font-size:12.5px;color:var(--cc)}
.meta{margin-top:11px;font:11.5px var(--mono);color:var(--dim2);
  display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.meta a{color:var(--cc);text-decoration:none;border-bottom:1px solid transparent}
.meta a:hover{border-bottom-color:var(--cc)}
.lists{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lists h5{font:9.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;
  margin:0 0 7px;font-weight:400}
.lists .up{color:var(--green)} .lists .dn{color:var(--amber)}
.lists button{display:block;width:100%;text-align:left;background:none;border:0;
  color:var(--dim);font:12px var(--sans);padding:3px 0;cursor:pointer;
  border-bottom:1px solid var(--line)}
.lists button:hover{color:var(--ink)}
.none{color:var(--dim2);font-size:11.5px}

.ctrl{position:absolute;right:16px;bottom:16px;display:flex;gap:7px;align-items:center}
.dots{position:absolute;left:16px;top:14px;display:flex;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line2);cursor:pointer;
  border:0;padding:0;transition:.15s}
.dot.on{background:var(--cc);transform:scale(1.55)} .dot.seen{background:var(--dim2)}
.legend{position:absolute;right:16px;top:14px;font:10px var(--mono);letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim2);text-align:right;line-height:1.9}
.legend s{text-decoration:none;display:inline-block;width:7px;height:7px;border-radius:50%;
  margin-right:6px}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;background:rgba(8,8,10,.86);z-index:30}
.load p{margin:0;color:var(--dim);font:12px var(--mono);letter-spacing:.1em;
  text-transform:uppercase}
.pbar{width:230px;height:2px;background:var(--line2)}
.pbar i{display:block;height:100%;width:0;background:var(--cc);transition:width .2s}
.err{color:var(--red);font:12px var(--mono);max-width:420px;text-align:center;line-height:1.7}

@media(max-width:760px){
  #q{width:140px}
  .card{left:8px;right:8px;bottom:62px;width:auto;max-height:46%}
  .lists{grid-template-columns:1fr}
  .ctrl{left:8px;right:8px;bottom:10px;justify-content:space-between}
  .legend{display:none}
}
</style>

<script>window.ATLAS_LOCK={"salt": "XcsLEjCISX4aCar61XTNsg==", "iter": 310000, "check": "UK6V9OAXvK9F+qlUkhpNDBSRqCVW+XNpPyVLUOnSUFwXEXzo"};</script>
<script>
(function(){
  var L = window.ATLAS_LOCK, KEY = null, IDLE = 15, ready = null;
  try { var v = +localStorage.getItem('atlas-idle-min'); if (v > 0) IDLE = v; } catch (e) {}
  function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
  function back(msg){
    try { localStorage.removeItem('atlas-key'); sessionStorage.removeItem('atlas-skey');
          if (msg) sessionStorage.setItem('atlas-lockmsg', msg); } catch (e) {}
    location.replace('index.html');
  }
  function saved(){
    var j = null;
    try { j = JSON.parse(sessionStorage.getItem('atlas-skey') || 'null'); } catch (e) {}
    if (j && j.s === L.salt) return j;
    try { j = JSON.parse(localStorage.getItem('atlas-key') || 'null'); } catch (e) { j = null; }
    return (j && j.s === L.salt && j.t > Date.now()) ? j : null;
  }
  function key(){
    if (ready) return ready;
    var j = saved();
    if (!j || !window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined') {
      back(''); return ready = new Promise(function(){});
    }
    return ready = crypto.subtle.importKey('raw', b64(j.k), {name: 'AES-GCM'}, false, ['decrypt']).then(function(k){
      var c = b64(L.check);
      return crypto.subtle.decrypt({name: 'AES-GCM', iv: c.slice(0, 12)}, k, c.slice(12)).then(function(){ KEY = k; });
    }).catch(function(){ back(''); return new Promise(function(){}); });
  }
  window.gxLoad = function(name){
    return key().then(function(){ return fetch('data/' + name + '.bin', {cache: 'no-cache'}); })
      .then(function(r){ if (!r.ok) throw new Error(name); return r.arrayBuffer(); })
      .then(function(b){ var u = new Uint8Array(b);
        return crypto.subtle.decrypt({name: 'AES-GCM', iv: u.slice(0, 12)}, KEY, u.slice(12)); })
      .then(function(p){ return new Response(new Blob([p]).stream().pipeThrough(new DecompressionStream('deflate'))).text(); })
      .then(function(t){ new Function(t)(); });
  };
  var last = Date.now();
  function touch(){ last = Date.now(); }
  ['pointerdown', 'pointermove', 'keydown', 'wheel', 'touchstart', 'scroll'].forEach(function(ev){
    addEventListener(ev, touch, {passive: true, capture: true});
  });
  function check(){
    if (Date.now() - last > IDLE * 60000) back('Locked after ' + IDLE + ' minutes without activity. Enter the password again.');
  }
  setInterval(check, 15000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) check(); });
  key();
})();

<script>
var D = null;

/* ============================================================= Atlas data ==
   We are inside the Atlas app folder, so we can load its own data files. The
   07:00 refresh rebuilds them; this page just reads whatever is there. */
var RAW = {}, LOADING = {}, WAIT = {}, META = null;
window.ATLAS = {
  modulesLoaded: function(m, meta){ META = meta; },
  /* Each data file names itself in d.meta.slug, so several can load at once. */
  moduleLoaded: function(d){
    var s = d && d.meta && d.meta.slug; if(!s) return;
    RAW[s] = d;
    if(WAIT[s]){ WAIT[s](d); delete WAIT[s]; }
  }
};

function loadModule(slug){
  if(RAW[slug]) return Promise.resolve(RAW[slug]);
  if(LOADING[slug]) return LOADING[slug];
  return LOADING[slug] = new Promise(function(res, rej){
    WAIT[slug] = res;
    gxLoad(slug).catch(function(){
      delete WAIT[slug]; delete LOADING[slug];
      rej(new Error('data/' + slug + '.bin'));
    });
  });
}
function loadMeta(){
  return new Promise(function(res, rej){
    gxLoad('galaxy_story').then(function(){ return gxLoad('modules'); })
      .then(res, function(){ rej(new Error('data/galaxy_story.bin / modules.bin')); });
  });
}

/* ============================================================== the graph ==
   node  = one form (k !== 'i')
   edge  A -> B = a field on A reads from a table B owns  (AXPFLDS.SRCTF),
                  so B must exist before A. */
var N = {}, ORDER = [], TBL = {}, EDGE = {}, REV = {};
var COLOR = {purchase:'#e5484d', finance:'#f5a524', payroll:'#30a46c',
             inventory:'#6e6ade', hr:'#a66ad6', tools:'#2ec8c8',
             qaqc:'#e07b39', hidden_pages:'#7c7c88'};

function ingest(slug){
  var d = RAW[slug]; if(!d || d.__in) return; d.__in = 1;
  var sc = d.screens, i, j;
  for(i = 0; i < sc.length; i++){
    var s = sc[i]; if(s.k === 'i') continue;
    var id = s.n.toLowerCase();
    if(N[id]) continue;
    var dcs = s.dcs || [], tbls = [], grids = [], main = null;
    for(j = 0; j < dcs.length; j++){
      var tb = (dcs[j].tbl || '').toLowerCase(); if(!tb) continue;
      if(tbls.indexOf(tb) < 0) tbls.push(tb);
      if(dcs[j].grid){ if(grids.indexOf(tb) < 0) grids.push(tb); }
      else if(!main) main = tb;
      if(!TBL[tb]) TBL[tb] = id;
    }
    N[id] = {id: id, cap: s.cap || s.n, slug: slug, col: COLOR[slug] || '#7c7c88',
             main: main, tbls: tbls, grids: grids, f: s.f || [],
             nf: (s.f || []).length, menus: s.menus || []};
    ORDER.push(id);
  }
}
function wire(){
  EDGE = {}; REV = {};
  for(var k = 0; k < ORDER.length; k++){
    var id = ORDER[k], f = N[id].f, seen = {};
    for(var i = 0; i < f.length; i++){
      var src = f[i].src; if(!src) continue;
      var tb = String(src).split(' . ')[0].trim().toLowerCase();
      var own = TBL[tb];
      if(!own || own === id || seen[own]) continue;
      seen[own] = 1;
      (EDGE[id] = EDGE[id] || []).push(own);
      (REV[own] = REV[own] || []).push(id);
    }
  }
}

/* ---- walk upstream / downstream to a depth ---- */
function walk(id, map, depth){
  var seen = {}, front = [id], out = [], d = 0;
  seen[id] = 1;
  while(front.length && d < depth){
    var nx = [];
    for(var i = 0; i < front.length; i++){
      var ns = map[front[i]] || [];
      for(var j = 0; j < ns.length; j++){
        if(seen[ns[j]]) continue;
        seen[ns[j]] = 1; out.push({id: ns[j], d: d + 1}); nx.push(ns[j]);
      }
    }
    front = nx; d++;
  }
  return out;
}

/* ================================================================ layout ===
   Module clusters on a ring, force relaxation inside each one. Deterministic:
   the galaxy looks the same every time you open it. */
var POS = {};
function seedRand(n){ var s = n * 9301 + 49297; return (s % 233280) / 233280; }
function layout(){
  var bySlug = {}, slugs = [], i, j;
  for(i = 0; i < ORDER.length; i++){
    var s = N[ORDER[i]].slug;
    if(!bySlug[s]){ bySlug[s] = []; slugs.push(s); }
    bySlug[s].push(ORDER[i]);
  }
  var cen = {};
  for(i = 0; i < slugs.length; i++){
    var a = 2 * Math.PI * i / slugs.length + .5;
    var R = slugs.length > 2 ? 560 : 0;
    cen[slugs[i]] = [R * Math.cos(a), 150 * Math.sin(2 * a), R * Math.sin(a)];
  }
  for(i = 0; i < ORDER.length; i++){
    var id = ORDER[i], c = cen[N[id].slug], r = seedRand(i + 1);
    POS[id] = [c[0] + (r - .5) * 300, c[1] + (seedRand(i + 7) - .5) * 220,
               c[2] + (seedRand(i + 13) - .5) * 300];
  }
  for(var it = 0; it < 60; it++){
    for(var s2 = 0; s2 < slugs.length; s2++){
      var ids = bySlug[slugs[s2]];
      for(i = 0; i < ids.length; i++){
        var p = POS[ids[i]], dx = 0, dy = 0, dz = 0;
        for(j = 0; j < ids.length; j++){
          if(i === j) continue;
          var o = POS[ids[j]];
          var ax = p[0] - o[0], ay = p[1] - o[1], az = p[2] - o[2];
          var r2 = ax * ax + ay * ay + az * az + 1;
          if(r2 > 15000) continue;
          var f = 2600 / r2; dx += ax * f; dy += ay * f; dz += az * f;
        }
        var cc = cen[N[ids[i]].slug];
        dx += (cc[0] - p[0]) * .06; dy += (cc[1] - p[1]) * .06; dz += (cc[2] - p[2]) * .06;
        p[0] += Math.max(-14, Math.min(14, dx));
        p[1] += Math.max(-14, Math.min(14, dy));
        p[2] += Math.max(-14, Math.min(14, dz));
      }
    }
  }
}
/* a tour lays its own chain out as an arc, so the story reads clearly */
function tourLayout(ch){
  var n = ch.steps.length, i;
  for(i = 0; i < n; i++){
    var t = (i / Math.max(1, n - 1)) - .5;
    POS[ch.steps[i].id.toLowerCase()] = [t * 1180,
      Math.sin(t * Math.PI * 1.15) * 120, Math.cos(t * Math.PI * .95) * 300 - 90];
  }
  for(i = 0; i < n; i++){
    var id = ch.steps[i].id.toLowerCase(), c = POS[id];
    var ups = (EDGE[id] || []).slice(0, 6);
    for(var j = 0; j < ups.length; j++){
      var a = 2 * Math.PI * j / Math.max(1, ups.length) + i * .7;
      POS[ups[j]] = [c[0] + 132 * Math.cos(a) * .82,
                     c[1] + 132 * Math.sin(a) * .95 - 18,
                     c[2] + Math.sin(a * 2 + i) * 62];
    }
  }
}
function roadLayout(ch){
  var i, t;
  for(i = 0; i < ch.long.length; i++){
    t = (i / Math.max(1, ch.long.length - 1)) - .5;
    POS[ch.long[i].toLowerCase()] = [t * 880,
      Math.sin(t * Math.PI * 1.15) * 120 - 150, Math.cos(t * Math.PI * .95) * 300 - 90];
  }
  for(i = 0; i < ch.short.length; i++)
    POS[ch.short[i].toLowerCase()] = [-270 + i * 520, 95, -40];
  POS['lbill'] && (POS['__lb'] = null);
}

/* ================================================================ camera ===*/
var cv = document.getElementById('cv'), cx = cv.getContext('2d');
var W = 0, H = 0, DPR = Math.min(2, window.devicePixelRatio || 1);
var yaw = -.34, pitch = -.17, zoom = .55, tZoom = .55;
var foc = [0, 0, 0], tFoc = [0, 0, 0], spin = false;
function size(){
  W = cv.clientWidth || 900; H = cv.clientHeight || 600;
  cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
size(); window.addEventListener('resize', size);
function proj(p){
  var x = p[0] - foc[0], y = p[1] - foc[1], z = p[2] - foc[2];
  var cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  var X = x * cy - z * sy, Z = x * sy + z * cy;
  var Y = y * cp - Z * sp; Z = y * sp + Z * cp;
  var f = 1500 / (1500 + Z + 900);
  return [W / 2 + X * f * zoom * 1.55, H / 2 + Y * f * zoom * 1.55, Z, f];
}
function rr(x, y, w, h, r){
  cx.beginPath(); cx.moveTo(x + r, y);
  cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r);
  cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath();
}

/* ================================================================== state ==*/
var MODE = 'tour';     /* tour | galaxy */
var ci = 0, si = 0, sel = null, hov = null, depth = 2, playing = false, tick = 0;
var pts = [], T = 0;

function chapter(){ return D.chapters[ci]; }
function curId(){
  var c = chapter();
  return c.kind === 'tour' && c.steps[si] ? c.steps[si].id.toLowerCase() : null;
}

/* what is highlighted right now */
function highlight(){
  var h = {}, i;
  if(MODE === 'galaxy'){
    if(!sel) return h;          /* nothing picked yet - plain galaxy, no leftovers */
    h[sel] = {k: 'sel'};
    var up = walk(sel, EDGE, depth), dn = walk(sel, REV, depth);
    for(i = 0; i < up.length; i++) h[up[i].id] = {k: 'up', d: up[i].d};
    for(i = 0; i < dn.length; i++) if(!h[dn[i].id]) h[dn[i].id] = {k: 'dn', d: dn[i].d};
    return h;
  }
  var c = chapter();
  if(c.kind === 'roads'){
    var f = si;
    for(i = 0; i < c.long.length; i++)
      h[c.long[i].toLowerCase()] = {k: (f === 0 || f === 2) ? 'up' : 'off'};
    for(i = 0; i < c.short.length; i++)
      h[c.short[i].toLowerCase()] = {k: (f === 1 || f === 2) ? 'dn' : 'off'};
    h['lbill'] = {k: (f === 2) ? 'sel' : (f === 0 ? 'up' : 'dn')};
    return h;
  }
  for(i = 0; i < c.steps.length; i++){
    var id = c.steps[i].id.toLowerCase();
    h[id] = {k: i === si ? 'sel' : i < si ? 'done' : 'future'};
  }
  var ups = (EDGE[curId()] || []).slice(0, 6);
  for(i = 0; i < ups.length; i++) if(!h[ups[i]]) h[ups[i]] = {k: 'up'};
  return h;
}

function draw(){
  T++;
  zoom += (tZoom - zoom) * .09;
  for(var k = 0; k < 3; k++) foc[k] += (tFoc[k] - foc[k]) * .09;
  if(spin) yaw += .0011;
  cx.clearRect(0, 0, W, H);

  var H2 = highlight(), col = sel && N[sel] ? N[sel].col : '#6e6ade';
  var c = chapter();
  if(MODE === 'tour') col = getComputedStyle(document.documentElement)
    .getPropertyValue(c.var).trim() || col;

  var vis = MODE === 'galaxy' ? ORDER : Object.keys(H2);
  pts = [];
  for(var i = 0; i < vis.length; i++){
    var id = vis[i]; if(!N[id] || !POS[id]) continue;
    var p = proj(POS[id]);
    pts.push({id: id, x: p[0], y: p[1], z: p[2], f: p[3], h: H2[id]});
  }
  var P = {}; for(i = 0; i < pts.length; i++) P[pts[i].id] = pts[i];

  /* edges */
  if(MODE === 'galaxy'){
    for(i = 0; i < ORDER.length; i++){
      var a = P[ORDER[i]], ns = EDGE[ORDER[i]] || []; if(!a) continue;
      for(var j = 0; j < ns.length; j++){
        var b = P[ns[j]]; if(!b) continue;
        var ha = H2[ORDER[i]], hb = H2[ns[j]];
        var lit = sel && (ha && hb);
        if(sel && !lit) continue;
        cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y);
        cx.strokeStyle = lit ? (hb.k === 'up' || ha.k === 'sel' ? '#30a46c' : '#f5a524')
                             : 'rgba(130,130,155,.05)';
        cx.lineWidth = lit ? 1.3 : .55; cx.stroke();
      }
    }
  } else if(c.kind === 'tour'){
    for(i = 0; i < c.steps.length - 1; i++){
      var a2 = P[c.steps[i].id.toLowerCase()], b2 = P[c.steps[i + 1].id.toLowerCase()];
      if(!a2 || !b2) continue;
      cx.beginPath(); cx.moveTo(a2.x, a2.y); cx.lineTo(b2.x, b2.y);
      cx.strokeStyle = i < si ? col : '#5f5f6a';
      cx.globalAlpha = i < si ? .5 : .14; cx.lineWidth = i < si ? 1.7 : .8;
      cx.stroke(); cx.globalAlpha = 1;
    }
    var cid = curId(), cp = P[cid];
    if(cp){
      var ups = (EDGE[cid] || []).slice(0, 6);
      for(i = 0; i < ups.length; i++){
        var up = P[ups[i]]; if(!up) continue;
        cx.beginPath(); cx.moveTo(cp.x, cp.y); cx.lineTo(up.x, up.y);
        cx.strokeStyle = '#30a46c'; cx.globalAlpha = .3; cx.lineWidth = 1;
        cx.stroke(); cx.globalAlpha = 1;
      }
    }
    if(si > 0){
      var pa = P[c.steps[si - 1].id.toLowerCase()], pb = cp;
      if(pa && pb){
        var t = (T % 90) / 90;
        cx.beginPath();
        cx.arc(pa.x + (pb.x - pa.x) * t, pa.y + (pb.y - pa.y) * t, 3.4, 0, 6.2832);
        cx.fillStyle = col; cx.globalAlpha = .9 * (1 - Math.abs(t - .5) * 1.2);
        cx.fill(); cx.globalAlpha = 1;
      }
    }
  } else {
    var seq = c.long.concat();
    for(i = 0; i < seq.length - 1; i++){
      var ra = P[seq[i].toLowerCase()], rb = P[seq[i + 1].toLowerCase()];
      if(!ra || !rb) continue;
      var onl = (si === 0 || si === 2);
      cx.beginPath(); cx.moveTo(ra.x, ra.y); cx.lineTo(rb.x, rb.y);
      cx.strokeStyle = '#30a46c'; cx.globalAlpha = onl ? .55 : .1;
      cx.lineWidth = onl ? 1.6 : .7; cx.stroke(); cx.globalAlpha = 1;
    }
    var sa = P[c.short[0].toLowerCase()], sb = P['lbill'];
    if(sa && sb){
      var ons = (si === 1 || si === 2);
      cx.beginPath(); cx.moveTo(sa.x, sa.y); cx.lineTo(sb.x, sb.y);
      cx.strokeStyle = '#e5484d'; cx.globalAlpha = ons ? .6 : .1;
      cx.lineWidth = ons ? 1.8 : .7; cx.stroke(); cx.globalAlpha = 1;
    }
  }

  /* nodes, far first */
  pts.sort(function(a, b){ return b.z - a.z; });
  for(i = 0; i < pts.length; i++){
    var q = pts[i], n = N[q.id], st = q.h ? q.h.k : null;
    var s = Math.max(.4, q.f * zoom * 1.5);
    var showPlate = (MODE === 'tour') || st || zoom > 1.1;
    var nc = st === 'up' ? '#30a46c' : st === 'dn' ? '#f5a524'
           : st === 'sel' ? (MODE === 'tour' ? col : n.col) : n.col;
    if(!showPlate){
      var r = Math.max(1.3, (1.9 + Math.min(4, n.nf / 46)) * s);
      cx.beginPath(); cx.arc(q.x, q.y, r, 0, 6.2832);
      cx.fillStyle = n.col; cx.globalAlpha = sel ? .1 : (.32 + .5 * q.f);
      cx.fill(); cx.globalAlpha = 1;
      if(hov === q.id){
        cx.beginPath(); cx.arc(q.x, q.y, r + 3.5, 0, 6.2832);
        cx.strokeStyle = '#ececf0'; cx.lineWidth = 1; cx.stroke();
      }
      continue;
    }
    var big = (st === 'sel'), w = (big ? 148 : 106) * s, h = (big ? 42 : 30) * s;
    var alpha = st === 'future' ? .18 : st === 'off' ? .12
              : st === 'done' ? .66 : st === 'sel' ? 1 : .8;
    cx.globalAlpha = alpha;
    if(big){ cx.shadowColor = nc; cx.shadowBlur = 26 * s; }
    rr(q.x - w / 2, q.y - h / 2, w, h, 3 * s);
    cx.fillStyle = big ? nc : '#15151a'; cx.fill(); cx.shadowBlur = 0;
    if(!big){ rr(q.x - w / 2, q.y - h / 2, w, h, 3 * s);
      cx.strokeStyle = nc; cx.lineWidth = (hov === q.id ? 1.8 : 1) * s; cx.stroke(); }
    cx.fillStyle = big ? '#08080a' : '#ececf0';
    cx.font = '600 ' + (big ? 12.5 : 10.5) * s + 'px "Segoe UI",system-ui,sans-serif';
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    var lab = n.cap.length > (big ? 20 : 16) ? n.cap.slice(0, big ? 19 : 15) + '…' : n.cap;
    cx.fillText(lab, q.x, q.y - (n.main ? 5 * s : 0));
    if(n.main){
      cx.font = (big ? 9.5 : 8.5) * s + 'px ui-monospace,Consolas,monospace';
      cx.fillStyle = big ? 'rgba(8,8,10,.66)' : '#5f5f6a';
      cx.fillText(n.main.slice(0, 22), q.x, q.y + 9 * s);
    }
    cx.globalAlpha = 1;
    if(big){
      var pr = 1 + Math.sin(T * .055) * .12;
      cx.beginPath(); cx.arc(q.x, q.y, 44 * s * pr, 0, 6.2832);
      cx.strokeStyle = nc; cx.globalAlpha = .22; cx.lineWidth = 1.2;
      cx.stroke(); cx.globalAlpha = 1;
    }
  }
  requestAnimationFrame(draw);
}

/* ================================================================== panel ==*/
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function atlasLink(id){ return 'index.html#/' + N[id].slug + '/screen/' + id; }

function panel(){
  var card = document.getElementById('card'), c = chapter();
  var id = MODE === 'galaxy' ? sel : curId();
  var colv = MODE === 'tour' ? ('var(' + c.var + ')')
           : (id && N[id] ? N[id].col : 'var(--indigo)');
  card.style.borderLeftColor = colv;
  document.documentElement.style.setProperty('--cc', colv);

  if(MODE === 'galaxy' && !id){
    card.innerHTML = '<div class="k">Impact map</div><h3>Pick any screen</h3>' +
      '<p>Click a dot, or search for it. You will see <b style="color:#30a46c">what it ' +
      'needs first</b> and <b style="color:#f5a524">what reads from it later</b> &mdash; ' +
      'so before you change a master you can see exactly what it touches.</p>' +
      '<div class="meta">' + ORDER.length + ' screens loaded / ' +
      Object.keys(EDGE).length + ' with links</div>';
    document.getElementById('dots').innerHTML = '';
    return;
  }
  if(c.kind === 'roads' && MODE === 'tour'){
    var s0 = c.steps[si];
    card.innerHTML = '<div class="k">' + esc(c.title) + ' &middot; step ' + (si + 1) +
      ' of ' + c.steps.length + '</div><h3>' + esc(s0.label) + '</h3><p>' + s0.text + '</p>';
    paintDots(c.steps.length); return;
  }

  var n = N[id];
  if(!n){ card.innerHTML = '<div class="k">Not loaded</div><h3>' + esc(id || '') +
    '</h3><p>That screen is in a module that is not loaded yet.</p>'; return; }

  var head, body;
  if(MODE === 'tour'){
    head = '<div class="k">' + esc(c.title) + ' &middot; step ' + (si + 1) + ' of ' +
           c.steps.length + '</div><h3>' + esc(n.cap) + '</h3>';
    body = '<p>' + c.steps[si].text + '</p>';
  } else {
    head = '<div class="k">' + esc(n.slug.replace('_', ' ')) + '</div><h3>' +
           esc(n.cap) + '</h3>';
    body = '<p>Writes one row into <b>' + esc(n.main || 'nothing of its own') + '</b>' +
      (n.grids.length ? ', with ' + n.grids.length + ' line table' +
        (n.grids.length === 1 ? '' : 's') : '') + '. ' + n.nf + ' fields.</p>';
  }

  var meta = [];
  if(n.main) meta.push('<code>' + esc(n.main) + '</code>');
  meta.push(n.nf + ' fields');
  meta.push('<a href="' + atlasLink(id) + '">open in Atlas &rarr;</a>');

  var up = walk(id, EDGE, MODE === 'galaxy' ? depth : 1);
  var dn = walk(id, REV, MODE === 'galaxy' ? depth : 1);
  function list(a, cls){
    if(!a.length) return '<span class="none">nothing</span>';
    return a.slice(0, 14).map(function(x){
      return '<button data-go="' + x.id + '">' + esc(N[x.id] ? N[x.id].cap : x.id) +
        (MODE === 'galaxy' && x.d > 1 ? ' <span class="none">&middot;' + x.d + '</span>' : '') +
        '</button>'; }).join('');
  }
  card.innerHTML = head + body +
    '<div class="meta">' + meta.join('<span style="color:#2e2e36">/</span> ') + '</div>' +
    '<div class="lists"><div><h5 class="up">Must exist first (' + up.length + ')</h5>' +
    list(up) + '</div><div><h5 class="dn">Reads from it (' + dn.length + ')</h5>' +
    list(dn) + '</div></div>';

  paintDots(c.kind === 'tour' && MODE === 'tour' ? c.steps.length : 0);
}
function paintDots(n){
  var d = document.getElementById('dots');
  if(!n){ d.innerHTML = ''; return; }
  var h = '';
  for(var i = 0; i < n; i++)
    h += '<button class="dot' + (i === si ? ' on' : i < si ? ' seen' : '') +
         '" data-s="' + i + '" aria-label="step ' + (i + 1) + '"></button>';
  d.innerHTML = h;
}
document.getElementById('dots').onclick = function(ev){
  var b = ev.target.closest('[data-s]'); if(!b) return;
  si = +b.dataset.s; playing = false; goStep();
};
document.getElementById('card').onclick = function(ev){
  var b = ev.target.closest('[data-go]'); if(!b) return;
  focusScreen(b.dataset.go);
};

/* ================================================================ control ==*/
function paintCtrl(){
  var c = chapter(), h = '';
  if(MODE === 'tour'){
    h = '<button class="ib" id="prev">&larr;</button>' +
        '<button class="ib" id="play">' + (playing ? 'Pause' : 'Play') + '</button>' +
        '<button class="ib" id="next">Next &rarr;</button>';
  } else {
    h = '<span class="ib" style="cursor:default">Depth</span>' +
        [1, 2, 99].map(function(d){
          return '<button class="ib' + (depth === d ? ' on' : '') + '" data-d="' + d +
                 '">' + (d === 99 ? 'All' : d) + '</button>'; }).join('') +
        '<button class="ib" id="clr">Clear</button>';
  }
  document.getElementById('ctrl').innerHTML = h;
  if(MODE === 'tour'){
    document.getElementById('prev').onclick = function(){ playing = false; step(-1); };
    document.getElementById('next').onclick = function(){ playing = false; step(1); };
    document.getElementById('play').onclick = function(){
      playing = !playing; tick = 0; paintCtrl(); };
  } else {
    document.getElementById('ctrl').onclick = function(ev){
      var b = ev.target.closest('[data-d]');
      if(b){ depth = +b.dataset.d; paintCtrl(); panel(); }
      if(ev.target.id === 'clr'){ sel = null; panel(); paintCtrl(); }
    };
  }
}
function step(d){
  var c = chapter();
  si += d;
  if(si >= c.steps.length){
    if(ci < D.chapters.length - 1){ ci++; si = 0; openChapter(); return; }
    si = c.steps.length - 1; playing = false;
  }
  if(si < 0){
    if(ci > 0){ ci--; si = D.chapters[ci].steps.length - 1; openChapter(); return; }
    si = 0;
  }
  goStep();
}
function goStep(){
  var c = chapter(), id = curId();
  if(c.kind === 'roads'){ tFoc = [0, 0, 0]; tZoom = .44; }
  else if(id && POS[id]){ tFoc = POS[id].slice(); tZoom = .92; }
  panel(); paintCtrl();
}
setInterval(function(){ if(playing && ++tick >= 5){ tick = 0; step(1); } }, 1000);

/* ================================================================== tabs ===*/
function paintTabs(){
  var t = document.getElementById('tabs');
  t.innerHTML = D.chapters.map(function(c, i){
    return '<button class="ib' + (MODE === 'tour' && i === ci ? ' on' : '') +
      '" data-c="' + i + '">' + esc(c.title) + '</button>'; }).join('') +
    '<button class="ib' + (MODE === 'galaxy' ? ' on' : '') + '" data-g="1">Impact map</button>';
  t.onclick = function(ev){
    var b = ev.target.closest('[data-c]'), g = ev.target.closest('[data-g]');
    if(b){ MODE = 'tour'; ci = +b.dataset.c; si = 0; sel = null; playing = false; openChapter(); }
    if(g){ goGalaxy(); }
  };
}
function openChapter(){
  var c = chapter();
  MODE = 'tour'; spin = false;
  say('Loading ' + c.title + '…');
  Promise.all(c.need.map(loadModule)).then(function(){
    for(var i = 0; i < c.need.length; i++) ingest(c.need[i]);
    wire();
    if(c.kind === 'roads') roadLayout(c); else tourLayout(c);
    done(); paintTabs(); goStep(); legend();
  }, fail);
}
function goGalaxy(){
  MODE = 'galaxy'; spin = true; playing = false;
  var want = D.mods.map(function(m){ return m.slug; });
  var todo = want.filter(function(s){ return !RAW[s]; });
  if(!todo.length){ afterGalaxy(); return; }
  say('Loading every module…', 0);
  var k = 0;
  (function nxt(){
    if(k >= todo.length){ afterGalaxy(); return; }
    loadModule(todo[k]).then(function(){
      k++; say('Loading every module… ' + k + ' of ' + todo.length, k / todo.length);
      nxt();
    }, fail);
  })();
}
function afterGalaxy(){
  for(var i = 0; i < D.mods.length; i++) if(RAW[D.mods[i].slug]) ingest(D.mods[i].slug);
  wire(); layout();
  tFoc = [0, 0, 0]; tZoom = .5; sel = null;
  done(); paintTabs(); paintCtrl(); panel(); legend();
}
document.getElementById('all').onclick = goGalaxy;

function legend(){
  var l = document.getElementById('legend');
  if(MODE === 'galaxy'){
    l.innerHTML = '<div><s style="background:#30a46c"></s>must exist first</div>' +
      '<div><s style="background:#f5a524"></s>reads from it</div>' +
      '<div>' + ORDER.length + ' screens</div>';
  } else {
    l.innerHTML = '<div><s style="background:#30a46c"></s>masters it reads</div>' +
      '<div>drag &middot; wheel+ctrl &middot; &larr; &rarr;</div>';
  }
}

/* ================================================================= search ==*/
var qi = document.getElementById('q'), sug = document.getElementById('sug');
qi.oninput = function(){
  var v = qi.value.trim().toLowerCase();
  if(v.length < 2){ sug.style.display = 'none'; return; }
  var hits = [];
  for(var i = 0; i < ORDER.length && hits.length < 24; i++){
    var n = N[ORDER[i]];
    if((n.cap + ' ' + n.id + ' ' + n.tbls.join(' ')).toLowerCase().indexOf(v) >= 0)
      hits.push(n);
  }
  sug.innerHTML = hits.length ? hits.map(function(n){
      return '<button data-f="' + n.id + '">' + esc(n.cap) +
             '<em>' + n.id + ' &middot; ' + esc(n.main || '') + ' &middot; ' +
             esc(n.slug) + '</em></button>'; }).join('')
    : '<button disabled style="color:#5f5f6a">Nothing matches' +
      (Object.keys(RAW).length < D.mods.length
        ? ' — try Load every module' : '') + '</button>';
  sug.style.display = 'block';
};
sug.onclick = function(ev){
  var b = ev.target.closest('[data-f]'); if(!b) return;
  sug.style.display = 'none'; qi.value = '';
  focusScreen(b.dataset.f);
};
document.addEventListener('click', function(ev){
  if(!ev.target.closest('.sw')) sug.style.display = 'none'; });

function focusScreen(id){
  if(!N[id]) return;
  if(MODE === 'tour'){
    var c = chapter(), k = -1;
    for(var i = 0; i < c.steps.length; i++)
      if(c.steps[i].id && c.steps[i].id.toLowerCase() === id) k = i;
    if(k >= 0){ si = k; playing = false; goStep(); return; }
    goGalaxy(); setTimeout(function(){ focusScreen(id); }, 60); return;
  }
  sel = id; spin = false;
  if(POS[id]){ tFoc = POS[id].slice(); tZoom = Math.max(tZoom, 1.05); }
  panel(); paintCtrl();
}

/* =============================================================== pointer ===*/
function pick(x, y){
  var best = null, bd = 420;
  for(var i = 0; i < pts.length; i++){
    var d = (pts[i].x - x) * (pts[i].x - x) + (pts[i].y - y) * (pts[i].y - y);
    if(d < bd){ bd = d; best = pts[i]; }
  }
  return best;
}
var drag = false, lx = 0, ly = 0, moved = 0, tip = document.getElementById('tip');
cv.addEventListener('pointerdown', function(ev){
  drag = true; moved = 0; lx = ev.offsetX; ly = ev.offsetY;
  cv.classList.add('drag'); cv.setPointerCapture(ev.pointerId); });
cv.addEventListener('pointerup', function(ev){
  drag = false; cv.classList.remove('drag');
  if(moved < 6){
    var h = pick(ev.offsetX, ev.offsetY);
    if(h) focusScreen(h.id);
    else if(MODE === 'galaxy'){ sel = null; panel(); }
  }
});
cv.addEventListener('pointermove', function(ev){
  if(drag){
    var dx = ev.offsetX - lx, dy = ev.offsetY - ly;
    moved += Math.abs(dx) + Math.abs(dy);
    yaw += dx * .006; pitch = Math.max(-1.2, Math.min(1.2, pitch + dy * .005));
    lx = ev.offsetX; ly = ev.offsetY; spin = false; tip.style.display = 'none'; return;
  }
  var h = pick(ev.offsetX, ev.offsetY);
  hov = h ? h.id : null;
  if(h && N[h.id]){
    tip.style.display = 'block';
    tip.style.left = Math.min(W - 250, ev.offsetX + 14) + 'px';
    tip.style.top = (ev.offsetY + 14) + 'px';
    tip.innerHTML = esc(N[h.id].cap) + '<b>' + h.id + ' &middot; ' +
                    esc(N[h.id].main || 'reads only') + '</b>';
  } else tip.style.display = 'none';
});
cv.addEventListener('pointerleave', function(){ tip.style.display = 'none'; hov = null; });
cv.addEventListener('wheel', function(ev){
  if(!ev.ctrlKey && !ev.metaKey && !ev.shiftKey && MODE === 'tour') return;
  ev.preventDefault();
  tZoom = Math.max(.2, Math.min(3.2, tZoom * (ev.deltaY > 0 ? .88 : 1.13)));
}, {passive: false});
document.addEventListener('keydown', function(ev){
  if(document.activeElement === qi){ if(ev.key === 'Escape') qi.blur(); return; }
  if(ev.key === '/'){ ev.preventDefault(); qi.focus(); }
  if(MODE !== 'tour') return;
  if(ev.key === 'ArrowRight'){ playing = false; step(1); }
  if(ev.key === 'ArrowLeft'){ playing = false; step(-1); }
  if(ev.key === ' '){ ev.preventDefault(); playing = !playing; tick = 0; paintCtrl(); }
});

/* ================================================================== boot ===*/
function say(m, p){
  document.getElementById('load').style.display = 'flex';
  document.getElementById('lmsg').textContent = m;
  document.getElementById('lbar').style.width = ((p || 0) * 100) + '%';
}
function done(){ document.getElementById('load').style.display = 'none'; }
function fail(e){
  document.getElementById('load').style.display = 'flex';
  document.getElementById('lmsg').innerHTML =
    '<span class="err">Could not load <b>' + esc(e && e.message || 'a data file') +
    '</b>.<br>This page must sit in the same folder as Atlas’s <b>index.html</b>, ' +
    'next to its <b>data</b> folder.</span>';
  document.getElementById('lbar').style.width = '0';
}

say('Loading…');
loadMeta().then(function(){
  document.getElementById('meta').textContent =
    META ? ('snapshot ' + META.scanned) : '';
  paintTabs(); openChapter(); requestAnimationFrame(draw);
}, fail);
</script>
</body>
</html>
