<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlas">
<meta name="description" content="Axpert Atlas: read-only developer console for Axpert ERP">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Axpert Atlas</title>
<meta name="robots" content="noindex, nofollow">
<!-- Axpert Atlas build 202611120707. Read-only. Offline: no CDN, no font link, no chart library; inline SVG + canvas only. -->
<style>
:root{
  --bg:#f6f8fc;--surf:#ffffff;--surf2:#f1f3f4;--surf3:#e9eef6;--ink:#1f1f1f;--ink2:#444746;--ink3:#747775;--line:#e1e3e1;--line2:#c4c7c5;
  --blue:#1a73e8;--blueb:#e8f0fe;--green:#188038;--greenb:#e6f4ea;--amber:#b06000;--amberb:#fef7e0;--red:#d93025;--redb:#fce8e6;
  --purple:#9334e6;--purpleb:#f3e8fd;--teal:#007b83;--tealb:#e4f7fb;--grey:#5f6368;--greyb:#f1f3f4;
  --e1:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);--e2:0 1px 2px rgba(60,64,67,.3),0 2px 6px 2px rgba(60,64,67,.15);
  --e3:0 4px 8px 3px rgba(60,64,67,.15),0 1px 3px rgba(60,64,67,.3);
  --r:16px;--ease:cubic-bezier(.2,0,0,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --font:"Google Sans Text","Google Sans","Roboto","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --disp:"Google Sans Display","Google Sans","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --mono:"Roboto Mono","Cascadia Mono",ui-monospace,Consolas,monospace;
  --nav:256px;
}
:root[data-theme="dark"]{
  --bg:#131314;--surf:#1e1f20;--surf2:#282a2c;--surf3:#2d3035;--ink:#e3e3e3;--ink2:#c4c7c5;--ink3:#8e918f;--line:#333537;--line2:#4a4d50;
  --blue:#8ab4f8;--blueb:#25334a;--green:#81c995;--greenb:#1f3326;--amber:#fdd663;--amberb:#3a321a;--red:#f28b82;--redb:#432523;
  --purple:#c58af9;--purpleb:#36284a;--teal:#78d9ec;--tealb:#1b3a40;--grey:#9aa0a6;--greyb:#2a2c2e;
  --e1:0 1px 2px rgba(0,0,0,.5);--e2:0 2px 6px rgba(0,0,0,.5);--e3:0 8px 22px rgba(0,0,0,.55);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:currentColor;flex:none}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--blueb)}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:3px solid var(--bg)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--nav) minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:0;height:100vh;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 14px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:conic-gradient(from 210deg,#4285f4,#34a853,#fbbc04,#ea4335,#4285f4)}
.logo span{width:30px;height:30px;border-radius:9px;background:#1a73e8;display:grid;place-items:center}
.logo svg{width:18px;height:18px;fill:#fff}
.brand b{display:block;font:500 18px/1.1 var(--disp);letter-spacing:-.2px}
.brand small{color:var(--ink3);font-size:12px}
.modsw{margin:0 4px 12px;border:1px solid var(--line2);border-radius:12px;background:var(--surf);padding:6px}
.modsw .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:2px 8px 4px;font-weight:500}
.mod{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:8px;font-size:13.5px;color:var(--ink2);text-decoration:none;transition:background .2s}
a.mod:hover{background:var(--surf2)}
.mod.on{background:var(--blueb);color:var(--blue);font-weight:500}
.mod i{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}
.mod.on i{background:var(--blue)}
.mod small{margin-left:auto;font-size:11px;color:var(--ink3)}
.ni{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;border:0;background:none;width:100%;height:44px;padding:0 16px;border-radius:999px;cursor:pointer;
  font-weight:500;font-size:14px;color:var(--ink2);text-align:left;transition:background .2s var(--ease)}
.ni:hover{background:var(--surf2)}
.ni.on{background:var(--blueb);color:var(--blue)}
.ni .b{margin-left:auto;font-size:12px;font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums}
.ni .b.r{background:var(--red);color:#fff;border-radius:999px;padding:0 8px;line-height:20px}
.navfoot{margin-top:auto;padding:14px 12px 4px;font-size:11.5px;color:var(--ink3);border-top:1px solid var(--line)}
.navfoot b{color:var(--ink2);font-weight:500}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--green);animation:live 2.4s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

.main{min-width:0;display:flex;flex-direction:column}
.appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.appbar.lift{border-color:var(--line);box-shadow:0 1px 6px rgba(60,64,67,.12)}
.hamb{display:none!important}
.search{flex:1;max-width:720px;display:flex;align-items:center;gap:12px;height:48px;padding:0 8px 0 16px;border-radius:999px;background:var(--surf3);border:0;cursor:text;color:var(--ink3);
  transition:background .2s,box-shadow .2s;text-align:left;min-width:0}
.search:hover{background:var(--surf);box-shadow:var(--e1)}
.search span{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font:500 11px var(--mono);border:1px solid var(--line2);border-radius:6px;padding:2px 7px;color:var(--ink3);background:var(--surf)}
.sp{flex:1}
.ib{position:relative;overflow:hidden;width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--ink2);display:grid;place-items:center;cursor:pointer;transition:background .2s;flex:none}
.ib:hover{background:var(--surf2)}
.ro{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--greenb);color:var(--green);font-size:12.5px;font-weight:500;white-space:nowrap}
.ro svg{width:16px;height:16px}
.view{padding:6px 28px 80px;max-width:1520px;width:100%;margin:0 auto}
.view>*{animation:fadeup .35s var(--ease) both}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}}

/* ---------- page head ---------- */
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:14px 0 18px}
.ph h1{font:400 30px/1.15 var(--disp);letter-spacing:-.4px;margin:0}
.ph p{margin:4px 0 0;color:var(--ink2);max-width:780px}
.crumbs{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink3);flex-wrap:wrap;margin-top:10px}
.crumbs a,.lnk{color:var(--blue);cursor:pointer;text-decoration:none}.crumbs a:hover,.lnk:hover{text-decoration:underline}
.crumbs svg{width:16px;height:16px;fill:var(--ink3)}

/* ---------- cards / bento ---------- */
.card{position:relative;background:var(--surf);border-radius:var(--r);box-shadow:var(--e1);min-width:0;transition:box-shadow .25s var(--ease),transform .3s var(--ease)}
.card.hov:hover{box-shadow:var(--e3)}
.spot::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(380px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--k,var(--blue)) 9%,transparent),transparent 60%)}
.spot:hover::after{opacity:1}
.ch{display:flex;align-items:center;gap:10px;padding:16px 20px 6px;flex-wrap:wrap}
.ch h3{font:500 16px/1.3 var(--font);margin:0;display:flex;align-items:center;gap:8px}
.ch .hint{font-size:12.5px;color:var(--ink3);width:100%;margin-top:-4px;order:3}
.ch .act{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.cb{padding:8px 20px 18px}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.bento>div{min-width:0}
.bento>div>.card{height:100%}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}

/* KPI scorecards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:16px}
.kpi{position:relative;overflow:hidden;background:var(--surf);border-radius:var(--r);box-shadow:var(--e1);padding:16px 18px 14px;border:0;text-align:left;cursor:pointer;
  transition:transform .35s var(--spring),box-shadow .3s var(--ease)}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--e3)}
.kpi::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(240px circle at var(--mx,50%) var(--my,-40%),color-mix(in srgb,var(--k,var(--blue)) 14%,transparent),transparent 60%)}
.kpi:hover::before{opacity:1}
.kpi .top{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:13px;font-weight:500}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--k,var(--blue)) 14%,transparent);color:var(--k,var(--blue))}
.ic svg{width:19px;height:19px;fill:currentColor}
.kpi .v{font:400 34px/1.1 var(--disp);letter-spacing:-.5px;margin:12px 0 2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--ink3)}
.kpi .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--k,var(--blue));transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.kpi:hover .bar{transform:scaleX(1)}

/* chips, buttons, fields */
.tool{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{position:relative;overflow:hidden;border:1px solid var(--line2);background:var(--surf);border-radius:8px;padding:5px 12px;font-weight:500;font-size:13px;color:var(--ink2);cursor:pointer;
  display:inline-flex;gap:6px;align-items:center;transition:background .2s}
.chip:hover{background:var(--surf2)}
.chip.on{background:var(--blueb);border-color:transparent;color:var(--blue)}
.chip.on::before{content:"";width:4px;height:8px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px);margin:0 3px 0 2px}
.chip .n{font-variant-numeric:tabular-nums;color:var(--ink3)}.chip.on .n{color:inherit}
.field{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:999px;padding:0 14px;background:var(--surf);height:40px;transition:border-color .2s,box-shadow .2s;min-width:0}
.field:focus-within{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.field input,.field select{border:0;outline:0;background:transparent;color:var(--ink);font:14px var(--font);min-width:0}
.field input{width:240px}
.field select{max-width:260px;cursor:pointer}
.field svg{width:18px;height:18px;fill:var(--ink3)}
.btn{position:relative;overflow:hidden;border:1px solid var(--line2);background:var(--surf);color:var(--blue);border-radius:999px;padding:7px 16px;font-weight:500;font-size:13.5px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:background .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{background:var(--blueb)}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--surf)}
.btn.pri:hover{box-shadow:var(--e1)}
.cnt{margin-left:auto;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.18;animation:rip .6s linear;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

/* status pills */
.st{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;white-space:nowrap;line-height:1.5}
.st svg{width:14px;height:14px;fill:currentColor}
.st-green{background:var(--greenb);color:var(--green)}.st-blue{background:var(--blueb);color:var(--blue)}.st-amber{background:var(--amberb);color:var(--amber)}
.st-red{background:var(--redb);color:var(--red)}.st-grey{background:var(--greyb);color:var(--grey)}.st-purple{background:var(--purpleb);color:var(--purple)}.st-teal{background:var(--tealb);color:var(--teal)}
.tg{display:inline-block;border-radius:6px;padding:0 6px;font:500 10.5px/18px var(--mono);letter-spacing:.03em;white-space:nowrap}
.tg-hid{background:var(--greyb);color:var(--grey)}.tg-ro{background:var(--blueb);color:var(--blue)}.tg-req{background:var(--amberb);color:var(--amber)}
.tg-fx{background:var(--purpleb);color:var(--purple)}.tg-uq{background:var(--tealb);color:var(--teal)}

/* tables */
.tw{overflow:auto;max-height:70vh;border-radius:0 0 var(--r) var(--r)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
th{position:sticky;top:0;z-index:2;background:var(--surf);color:var(--ink2);font-weight:500;font-size:12.5px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th.s{cursor:pointer}th.s:hover{color:var(--ink)}
th .ar{display:inline-block;width:14px;opacity:.3;margin-left:2px}th.sorted .ar{opacity:1;color:var(--blue)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr.go{cursor:pointer}
tbody tr:hover{background:color-mix(in srgb,var(--blue) 6%,transparent)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td .sub{display:block;font:12px var(--mono);color:var(--ink3)}
td b{font-weight:500}
.dim{color:var(--ink3)}
.ishid td{opacity:.6}
.person{display:flex;align-items:center;gap:10px;min-width:190px}
.person b{font-weight:500;display:block;line-height:1.25}.person small{color:var(--ink3);font:12px var(--mono)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:500;font-size:12px;flex:none}
.avs{display:flex}.avs .av{width:26px;height:26px;font-size:10.5px;border:2px solid var(--surf);margin-left:-8px}.avs .av:first-child{margin-left:0}
.avs .more{background:var(--surf2);color:var(--ink2)}
.more-row{display:flex;justify-content:center;padding:12px}
.empty{padding:44px 20px;text-align:center;color:var(--ink3)}
.empty svg{width:48px;height:48px;fill:var(--line2);display:block;margin:0 auto 8px}

/* charts */
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{flex:none}
.donut circle.seg{fill:none;cursor:pointer;transition:stroke-width .2s var(--ease);animation:sweep 1.1s var(--ease) both}
.donut circle.seg:hover{stroke-width:24}
@keyframes sweep{from{stroke-dasharray:0 1000}}
.donut .c1{font:400 30px var(--disp);fill:var(--ink)}.donut .c2{font:12px var(--font);fill:var(--ink3)}
.dl{display:flex;flex-direction:column;gap:2px;min-width:170px;flex:1}
.dl .r{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;transition:background .15s}
.dl .r[data-go^="#"]{cursor:pointer}
.dl .r:hover{background:var(--surf2)}
.dl .r b{font-weight:500;font-variant-numeric:tabular-nums}.dl .r small{color:var(--ink3);min-width:38px;text-align:right}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.hb{display:grid;grid-template-columns:minmax(120px,220px) 1fr 52px;gap:10px;align-items:center;padding:5px 6px;border-radius:8px;transition:background .15s}
.hb[data-go^="#"]{cursor:pointer}
.hb:hover{background:var(--surf2)}
.hb .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;min-width:0}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:500;font-size:13px}
.track{height:10px;border-radius:99px;background:var(--surf2);overflow:hidden;display:flex}
.track span{display:block;height:100%;transform-origin:left;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{font-weight:500}
.stack100{height:14px;border-radius:99px;overflow:hidden;display:flex;background:var(--surf2)}
.stack100 span{height:100%;transform-origin:left;animation:grow .9s var(--ease) both}
.sec{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:500;margin:18px 0 8px}

/* tabs */
.tabs{position:relative;display:flex;gap:2px;border-bottom:1px solid var(--line);margin:8px 0 20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;overflow:hidden;border:0;background:none;padding:12px 18px 13px;font-weight:500;font-size:14px;color:var(--ink2);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;flex:none}
.tab:hover{background:var(--surf2)}.tab.on{color:var(--blue)}
.tab .n{font-size:12px;color:var(--ink3);background:var(--surf2);border-radius:999px;padding:0 7px}
.tab.on .n{background:var(--blueb);color:var(--blue)}
.ind{position:absolute;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--blue);transition:left .35s var(--ease),width .35s var(--ease)}

/* hero */
.hero{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;padding:22px 24px}
.hero .big{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--k,var(--blue)) 14%,transparent);color:var(--k,var(--blue))}
.hero .big svg{width:28px;height:28px;fill:currentColor}
.hero h2{font:400 28px/1.15 var(--disp);margin:0;letter-spacing:-.3px;overflow-wrap:anywhere}
.hero .meta{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--ink2);align-items:center}
.hero .meta code{font:500 12.5px var(--mono);background:var(--surf2);padding:1px 7px;border-radius:6px;overflow-wrap:anywhere}
.hero .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* rule flow */
.rule{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--surf)}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:stretch;margin-top:10px}
.step{border-radius:10px;background:var(--surf2);padding:10px 12px;position:relative;min-width:0}
.step+.step::before{content:"";position:absolute;left:-10px;top:50%;width:10px;height:2px;background:var(--line2)}
.step .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.step .v{font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.step code,.rule code{font:12.5px var(--mono);overflow-wrap:anywhere}
.rule .rm{font-size:12.5px;color:var(--ink3);margin-top:8px}
.rule .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rule .hd b{font-weight:500}

/* settings */
.sets{display:flex;gap:8px;flex-wrap:wrap}
.setp{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:500;border:1px solid var(--line2);color:var(--ink3)}
.setp.on{border-color:transparent;background:var(--greenb);color:var(--green)}
.setp svg{width:14px;height:14px;fill:currentColor}

/* DC anatomy */

/* command palette */
.pal{position:fixed;left:50%;top:10vh;width:min(680px,94vw);transform:translateX(-50%) scale(.97);opacity:0;pointer-events:none;z-index:71;background:var(--surf);border-radius:20px;box-shadow:var(--e3);

mark{background:color-mix(in srgb,var(--amber) 28%,transparent);color:inherit;border-radius:3px}

/* access path */

/* health */

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surf);padding:10px 18px;border-radius:8px;font-size:13.5px;opacity:0;transition:.25s;z-index:90;pointer-events:none}

/* ---------- web app additions (07/11/2026) ---------- */

    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}

}

.gxsec{margin-top:14px}.gxsh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding:4px 0 6px;margin-bottom:6px}

  const c=cols[st.k];const sorted=rows.slice().sort((a,b)=>{const x=c.k(a),y=c.k(b);return (x>y?1:x<y?-1:0)*st.d;});

function drawMatrix(){
  const cv=$("#mx");if(!cv||!S)return;
  const cols=S.filter(s=>mxMode==="t"?s.k==="t":s.k!=="p").sort((a,b)=>a.folder.localeCompare(b.folder)||a.cap.localeCompare(b.cap));
  const rows=Object.keys(R).map(r=>({r,n:cols.filter(s=>s.roles[r]).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n||a.r.localeCompare(b.r));
  const small=innerWidth<700,cell=small?14:12,gap=2,LW=small?130:200,TH=small?130:160,dpr=window.devicePixelRatio||1,st=cell+gap;
  const W=LW+cols.length*st+30,Hh=TH+rows.length*st+12;
  cv.width=W*dpr;cv.height=Hh*dpr;cv.style.width=W+"px";cv.style.height=Hh+"px";
  const g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);
  const C={blue:css("--blue"),teal:css("--teal"),amber:css("--amber"),e:css("--surf2"),ink:css("--ink"),ink3:css("--ink3"),line2:css("--line2")};
  const font=css("--font");g.textBaseline="middle";
  let i0=0,b=0;while(i0<cols.length){let i1=i0;while(i1<cols.length&&cols[i1].folder===cols[i0].folder)i1++;g.fillStyle=b++%2?C.line2:C.blue;g.fillRect(LW+i0*st,TH-8,(i1-i0)*st-gap,4);i0=i1;}
  const cut=(t,n)=>t.length>n?t.slice(0,n-1)+"…":t;
  cols.forEach((s,i)=>{g.save();g.translate(LW+i*st+cell/2+3,TH-14);g.rotate(-Math.PI/3);g.fillStyle=C.ink3;g.font="11px "+font;g.fillText(cut(s.cap,small?18:26),0,0);g.restore();});
  rows.forEach((row,j)=>{const y=TH+j*st;g.fillStyle=C.ink;g.font="12px "+font;g.textAlign="right";g.fillText(cut(row.r,small?15:24),LW-36,y+cell/2);
    g.fillStyle=C.ink3;g.font="11px "+css("--mono");g.fillText(row.n,LW-10,y+cell/2);g.textAlign="left";
    cols.forEach((s,i)=>{const a=s.roles[row.r];g.fillStyle=!a?C.e:a.menu&&a.obj?C.blue:a.obj?C.teal:C.amber;g.beginPath();
      if(g.roundRect)g.roundRect(LW+i*st,y,cell,cell,3);else g.rect(LW+i*st,y,cell,cell);g.fill();});});
  const tip=$("#tip");let lastTap=null;
  const hit=e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,i=Math.floor((x-LW)/st),j=Math.floor((y-TH)/st);
    return (x>=LW&&y>=TH&&i>=0&&j>=0&&i<cols.length&&j<rows.length)?{s:cols[i],r:rows[j].r}:null;};
  const show=(e,h)=>{const a=h.s.roles[h.r];tip.innerHTML='<b>'+esc(h.r)+'<\/b> → <b>'+esc(h.s.cap)+'<\/b><br>'+(a?(a.menu&&a.obj?"Menu + screen access":a.obj?"Screen access, no menu entry":"Menu entry, no screen access"):"No access")+'<br>'+liveUsers(h.r).length+' people in role · '+esc(h.s.folder)+(e.pointerType==="touch"?'<br><i>tap again to open<\/i>':"");
    tip.style.left=Math.max(8,Math.min(e.clientX+14,innerWidth-330))+"px";tip.style.top=(e.clientY+14)+"px";tip.classList.add("on");};
  cv.onpointermove=e=>{if(e.pointerType!=="mouse")return;const h=hit(e);if(!h){tip.classList.remove("on");cv.style.cursor="default";return;}cv.style.cursor="pointer";show(e,h);};
  cv.onpointerleave=()=>tip.classList.remove("on");
  cv.onpointerup=e=>{const h=hit(e);if(!h)return;
    if(e.pointerType!=="mouse"){const k=h.r+"|"+h.s.id;if(lastTap!==k){lastTap=k;show(e,h);return;}}
    tip.classList.remove("on");go("#/screen/"+h.s.id+"/access");};
}

    workU.forEach(u=>I.push({g:"People",ic:"people",k:"var(--green)",t:U[u].nm||u,m:u+" · "+(U[u].dept||"")+" · "+hrLabel(U[u].hr),s:(u+" "+(U[u].nm||"")).toLowerCase(),go:"#/person/"+enc(u)}));
    Object.keys(R).forEach(r=>I.push({g:"Roles",ic:"key",k:"var(--teal)",t:r,m:liveUsers(r).length+" people · "+(roleScreens[r]||[]).length+" screens",s:r.toLowerCase(),go:"#/role/"+enc(r)}));
    forms.forEach(s=>s.f.forEach(f=>I.push({g:"Fields",ic:"field",k:"var(--purple)",t:f.cap||f.n,m:f.n+" · "+s.cap,s:(f.n+" "+(f.cap||"")).toLowerCase(),go:"#/screen/"+s.id+"/fields/"+enc(f.n)})));

    H.forEach(x=>I.push({g:"Health",ic:x.ic,k:x.k,t:x.ttl,m:x.list.length+" found",s:x.ttl.toLowerCase(),go:"#/health/"+x.id}));

let hits=[],hi=0;
const hl=(t,q)=>{t=String(t);const i=q?t.toLowerCase().indexOf(q):-1;return i<0?esc(t):esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"<\/mark>"+esc(t.slice(i+q.length));};
const ORDER=["Modules","Projects","Companies","Screens","People","Roles","Fields","Report columns","Health"];
function palSearch(){
  const q=$("#palq").value.trim().toLowerCase(),res=$("#palres"),I=index();
  if(!q){const jump=(CUR&&NAV&&!/^#\/(all\/|$)/.test(location.hash||"#/")?NAV.map(n=>({ic:n[2],t:n[1],go:"#/"+n[0]})):[]).concat([{ic:"home",t:"All modules",go:"#@/"},{ic:"people",t:"People · all modules",go:"#@/all/people"},{ic:"tree",t:"Project access",go:"#@/all/projects"},{ic:"apps",t:"Company access",go:"#@/all/companies"}]);
    hits=jump;hi=0;res.innerHTML='<div class="grp">Jump to<\/div>'+jump.map((n,i)=>'<div class="it" data-i="'+i+'"><span class="ic">'+ico(n.ic)+'<\/span><div><b>'+esc(n.t)+'<\/b><\/div><\/div>').join("");mark();return;}
  const w=q.split(/\s+/),all=I.filter(x=>w.every(z=>x.s.includes(z))).sort((a,b)=>(a.s.startsWith(q)?0:1)-(b.s.startsWith(q)?0:1));

    :'<div class="empty">'+ico("info")+'Nothing found for "'+esc(q)+'"<\/div>';

function mark(){$$("#palres .it").forEach(e=>e.classList.toggle("sel",+e.dataset.i===hi));const s=$("#palres .it.sel");s&&s.scrollIntoView({block:"nearest"});}

/* session timeout (09/11/2026): the encrypted copy locks itself after IDLE_MIN minutes without activity,
   forgets any remembered key, and asks for the password again. "Remember" now lasts REMEMBER_H hours, not 30 days. */
const IDLE_MIN=(()=>{try{const v=+localStorage.getItem("atlas-idle-min");return v>0?v:15;}catch(e){return 15;}})(),REMEMBER_H=8;
function lockOut(msg){try{localStorage.removeItem("atlas-key");sessionStorage.removeItem("atlas-skey");if(msg)sessionStorage.setItem("atlas-lockmsg",msg);}catch(e){}location.reload();}
let idleWatch=null;
function startIdleWatch(){if(!window.ATLAS_LOCK||idleWatch)return;let last=Date.now();
  const touch=()=>{last=Date.now();};["pointerdown","pointermove","keydown","wheel","touchstart","scroll"].forEach(ev=>addEventListener(ev,touch,{passive:true,capture:true}));
  const check=()=>{if(Date.now()-last>IDLE_MIN*60000)lockOut("Locked after "+IDLE_MIN+" minutes without activity. Enter the password again.");};
  idleWatch=setInterval(check,15000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)check();});}

/* ---------- walks ---------- */
function gxWalk(g,R,kind){
  const S=[],ids=rs=>rs.map(r=>r.i),st=(t,x,l)=>{if(l.length)S.push({t,x,ids:l});};
  const own=[...new Set(g.dcs.map(d=>d.tb).filter(Boolean))].join(", ");
  if(kind==="save"){
    st("Lists come from SQL","Each drop-down shows only rows its SQL returns.",ids(R.filter(r=>r.w==="field"&&/list comes/.test(r.t))));
    st("Fill grid","Rows are pulled in from other tables at this moment.",ids(R.filter(r=>r.w==="fillgrid")));
    st("Field checks","Validated while typing. These are the messages a user can see.",ids(R.filter(r=>r.w==="field"&&r.k==="VALIDATION")));
    st("Save control",g.settings.save?"Last gate before writing.":"No save control: nothing stops Save at structure level.",ids(R.filter(r=>r.w==="save"&&r.k!=="FLOW")));
    st("Written","The record goes into "+own+". Genmap / mdmap then write into other tables.",ids(R.filter(r=>r.w==="save"&&r.k==="FLOW")));
    st("Inside Oracle","Triggers on those tables run now, outside Axpert.",ids(R.filter(r=>r.w==="db")));
    st("After save","Actions bound to 'After save transaction'.",ids(R.filter(r=>r.w==="action"&&/after save/i.test(r.t))));
  }else{
    st("Delete control",g.settings.delete?"Runs first. If it returns a message, Cancel / Remove stops here.":"No delete control: Cancel / Remove is not guarded.",ids(R.filter(r=>r.w==="delete")));
    st("Cancel action","Cancel steps defined in the structure.",ids(R.filter(r=>r.w==="action"&&/cancel/i.test(r.t))));
    st("Reverse what Save wrote","Every genmap row is taken back, every mdmap value reduced.",ids(R.filter(r=>r.w==="save"&&r.k==="FLOW")));
    st("Inside Oracle","Triggers run on the reversal too (for example the negative stock check).",ids(R.filter(r=>r.w==="db")));
  }
  return S;
}

/* ---------- PROOF FROM THE LIVE DATA (pilot 11/11/2026) ----------
   data/gx/proof_<t>.js <- galaxy/build_proof.py (SELECT only). Galaxy says what the definition says; this says whether the data agrees.
   Status: proven (green) · unproven = cannot be shown from the data (grey) · contra = the data says otherwise (red). */
GXD.proof = {};
window.GX.proofLoaded = p => { GXD.proof[p.t] = p; };
const PFS = { proven: ["st-green", "Proven by data"], unproven: ["st-grey", "Not proven"], contra: ["st-red", "Data says otherwise"] };

function gxProofLoad(n) {
  if (GXD.proof[n]) return Promise.resolve();
  const idx = GXD.proofIdx ? Promise.resolve() : load("gx/proof_index").catch(() => { GXD.proofIdx = []; });
  return idx.then(() => (GXD.proofIdx || []).includes(n) ? load("gx/proof_" + n).catch(() => null) : null);
}
function pfWrite(w) {
  const head = '<b>' + esc(w.table) + '<\/b> · ' + esc(w.map) + (w.rows12 != null ? ' · ' + fmt(w.rows12) + ' rows in 12 months from ' + fmt(w.docs) + ' documents (' + w.coverage + '% of all)' : "");
  let h = '<div class="pfi"><div class="pfh">' + pfChip(w.status) + '<span>' + head + '<\/span><\/div>';
  if (w.note) h += '<p class="pfn">' + esc(w.note) + '<\/p>';
  if (w.fields && w.fields.length) h += '<div class="tw"><table class="pft"><thead><tr><th>Column in ' + esc(w.table) + '<\/th><th>Comes from<\/th><th>Check<\/th><th class="num">Rows equal<\/th><\/tr><\/thead><tbody>' +

function jdays(a,b){
  const p=s=>{const m=(s||"").match(/(\d\d)\/(\d\d)\/(\d{4})/);return m?new Date(+m[3],m[2]-1,+m[1]):null;};
  const x=p(a),y=p(b);return x&&y?Math.round((y-x)/864e5):null;
}
function jStop(){JS.play=false;clearInterval(JS.timer);}

function jDraw(){
  const J=GXD.jr,F=J.flows[JS.f],types=Object.keys(F.examples);
  if(!JS.t||!F.examples[JS.t])JS.t=types.includes("INVENTORY")?"INVENTORY":types[0];
  const E=F.examples[JS.t];
  if(JS.i>=E.steps.length)JS.i=0;
  const cover=J.flows.reduce((a,f)=>a+f.share,0);
  let h='<div class="crumbs"><a data-go="#/galaxy">Galaxy<\/a>'+ico("chev")+'<span>Item Journey<\/span><\/div><div class="ph"><div><h1>Item Journey<\/h1><p>How a real Material Request travels through Axpert, from the site request to the bank. '+
    'Every box is a real document. '+J.flows.length+' flows cover '+cover.toFixed(0)+'% of '+fmt(J.total)+' request lines in the last '+J.months+' months. Data '+esc(J.built)+'.<\/p><\/div><\/div>';
  h+='<div class="jgrid"><aside class="jflows card"><div class="sec" style="margin-top:0">Pick a flow<\/div>'+J.flows.map((f,k)=>
      '<button class="jf'+(k===JS.f?" on":"")+'" data-f="'+k+'"><span class="jfs">'+f.share+'%<\/span><span class="jfp">'+
      f.path.slice().sort((a,b)=>JORDER.indexOf(a)-JORDER.indexOf(b)).map(p=>'<i style="--c:'+JCOL[JSTG[p]||"purchase"]+'">'+esc(JNAME[p]||p)+'<\/i>').join("")+
      '<\/span><small>'+fmt(f.lines)+' request lines<\/small><\/button>').join("")+'<\/aside><section class="jmain">';
  h+='<div class="card jhead"><div class="jtypes"><span class="dim">Item type<\/span>'+["INVENTORY","NON INVENTORY","ASSET"].map(t=>
      '<button class="chip'+(t===JS.t?" on":"")+'"'+(F.examples[t]?' data-t="'+t+'"':' disabled')+'>'+JTYPE[t]+'<\/button>').join("")+'<\/div>'+
    '<h2>'+esc(E.item)+'<\/h2><div class="meta"><span class="st st-blue">'+esc(JTYPE[E.itype]||E.itype||"")+'<\/span><span>MR <code class="mono">'+esc(E.mr)+'<\/code><\/span>'+
    '<span>'+esc(E.qty)+' '+esc(E.unit||"")+'<\/span><span>'+esc((E.project||"").slice(0,60))+'<\/span>'+
    (E.workflow.name?'<span>approval <b>'+esc(E.workflow.name)+'<\/b> · '+E.workflow.roles.length+' levels<\/span>':"")+
    '<span>'+fmt(E.lines_of_item)+' lines of this item took this flow<\/span><\/div><\/div>';
  h+='<div class="card jstage"><div class="jbar"><button class="btn" id="jp">←<\/button><button class="btn pri" id="jplay">'+(JS.play?"❚❚ Pause":"▶ Play the journey")+
    '<\/button><button class="btn" id="jn">→<\/button><span class="cnt">Step '+(JS.i+1)+' of '+E.steps.length+'<\/span><\/div>'+jRoad(E)+'<\/div>';
  h+='<div class="jbottom"><div class="card jdet">'+jDetail(E,JS.i)+'<\/div><div class="card jtime"><h3>Timeline<\/h3>'+E.steps.map((s,k)=>{
      const g=k?jdays(E.steps[k-1].at,s.at):null;
      return '<button class="jt'+(k===JS.i?" on":"")+'" data-i="'+k+'"><i style="background:'+JCOL[s.stage||"other"]+'"><\/i><b>'+esc(jLabel(s))+'<\/b><span>'+
        esc((s.at||"pending").slice(0,10))+(g!=null&&g>0?' <em>+'+g+'d<\/em>':"")+'<\/span><\/button>';}).join("")+
    (E.project_use&&E.project_use.length?'<div class="sec">After this, the project used the item (all its documents)<\/div><div class="rl">'+E.project_use.map(u=>
      '<span class="st '+(u.sign==="+"?"st-green":"st-amber")+'">'+esc(u.map)+' '+u.sign+fmt(u.qty)+' · '+u.docs+' docs<\/span>').join("")+'<\/div>':"")+'<\/div><\/div>';
  h+='<\/section><\/div>';
  $("#view").innerHTML=h;
  const V=$("#view");bindGo(V);
  $$(".jf",V).forEach(b=>b.onclick=()=>{JS.f=+b.dataset.f;JS.t=null;JS.i=0;jStop();jDraw();});
  $$("[data-t]",V).forEach(b=>b.onclick=()=>{JS.t=b.dataset.t;JS.i=0;jStop();jDraw();});
  const go=k=>{JS.i=Math.max(0,Math.min(E.steps.length-1,k));jDraw();};
  $$(".jt,.jst",V).forEach(b=>b.addEventListener("click",()=>{jStop();go(+b.dataset.i);}));
  gq("#jp",V).onclick=()=>{jStop();go(JS.i-1);};
  gq("#jn",V).onclick=()=>{jStop();go(JS.i+1);};
  gq("#jplay",V).onclick=()=>{
    if(JS.play){jStop();jDraw();return;}
    JS.play=true;if(JS.i>=E.steps.length-1)JS.i=0;jDraw();
    JS.timer=setInterval(()=>{if(!document.querySelector(".jstage")){jStop();return;}
      if(JS.i>=E.steps.length-1){jStop();jDraw();return;}JS.i++;jDraw();},2200);
  };
}

/* isometric road: each step is a block, the item token sits on the current one */
function jRoad(E){
  const n=E.steps.length,per=Math.min(7,Math.max(4,Math.ceil(n/2))),s=58;
  /* road runs left to right (x), rows go back (y); a small y-tilt gives the 3D look without crushing the labels */
  const iso=(x,y,z)=>[x*s*1.0+y*s*0.55,y*s*0.62+x*s*0.12-z*s*0.62];
  const pos=E.steps.map((_,k)=>{const r=Math.floor(k/per),c=k%per,x=r%2?per-1-c:c;return [x*2.35,r*2.9];});
  const P=pos.map(p=>iso(p[0],p[1],0)),pt=q=>q.map(z=>z.join(",")).join(" ");
  const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),x0=Math.min(...xs)-110,y0=Math.min(...ys)-110,W=Math.max(...xs)-x0+110,H=Math.max(...ys)-y0+60;
  let g='<svg class="jroad" viewBox="'+x0+' '+y0+' '+W+' '+H+'"><defs><radialGradient id="jtok"><stop offset="0" stop-color="#fff"/>'+
    '<stop offset=".45" stop-color="#ffd54f"/><stop offset="1" stop-color="#f57c00"/><\/radialGradient><\/defs>';
  g+='<polyline class="jway" points="'+pt(P)+'"/><polyline class="jway done" points="'+pt(P.slice(0,JS.i+1))+'"/>';
  const cube=(x,y,h,col,cls,k,lab,sub)=>{
    const c4=z=>[iso(x-.42,y-.42,z),iso(x+.42,y-.42,z),iso(x+.42,y+.42,z),iso(x-.42,y+.42,z)];
    const [a,b,c,d]=c4(0),[A,B,C,D]=c4(h),top=Math.min(A[1],B[1],C[1],D[1]),cx=(A[0]+C[0])/2;
    return '<g class="jst '+cls+'" data-i="'+k+'" style="--c:'+col+'"><polygon class="l" points="'+pt([d,c,C,D])+'"/><polygon class="r" points="'+pt([c,b,B,C])+'"/>'+
      '<polygon class="t" points="'+pt([A,B,C,D])+'"/><text class="n" x="'+cx+'" y="'+((A[1]+C[1])/2+4)+'" text-anchor="middle">'+(k+1)+'<\/text>'+
      '<text class="lab" x="'+cx+'" y="'+(top-15)+'" text-anchor="middle">'+esc(lab)+'<\/text><text class="sub" x="'+cx+'" y="'+(top-2)+'" text-anchor="middle">'+esc(sub)+'<\/text><\/g>';
  };
  E.steps.forEach((st,k)=>{
    const pend=!st.at,h=k===JS.i?1.25:(st.stage==="payment"||st.code==="PB"?.95:.7);
    g+=cube(pos[k][0],pos[k][1],h,pend?"var(--grey)":JCOL[st.stage||"other"],(k===JS.i?"on ":"")+(k<JS.i?"past ":"")+(pend?"pend":""),k,
      jLabel(st),(st.doc||"pending").slice(0,18));
  });
  const T=iso(pos[JS.i][0],pos[JS.i][1],1.25+.6);
  g+='<g class="jtok"><circle cx="'+T[0]+'" cy="'+T[1]+'" r="14" fill="url(#jtok)"/><\/g>';
  return g+'<\/svg>';
}

function jDetail(E,i){
  const s=E.steps[i],prev=i?E.steps[i-1]:null,gap=prev?jdays(prev.at,s.at):null;
  let h='<div class="jdh"><span class="jdn" style="background:'+JCOL[s.stage||"other"]+'">'+(i+1)+'<\/span><div><h3>'+esc(s.title)+
    (s.sub&&s.sub!==s.title?' <small>'+esc(s.sub)+'<\/small>':"")+'<\/h3><div class="meta">'+(s.doc?'<code class="mono">'+esc(s.doc)+'<\/code>':"<b>not done yet<\/b>")+
    (s.at?'<span>'+esc(s.at)+'<\/span>':"")+(s.name?'<span>'+esc(s.name)+' · <code class="mono">'+esc(s.user)+'<\/code><\/span>':"")+
    (gap!=null?'<span class="st st-amber">'+gap+' days after the previous step<\/span>':"")+'<\/div><\/div><\/div>';
  const kv=[];
  if(s.qty!=null&&s.qty!=="")kv.push(["Quantity",fmt(s.qty)+" "+(E.unit||"")]);
  if(s.rate)kv.push(["Rate",s.rate]);
  if(s.docdate)kv.push(["Document date",s.docdate]);
  if(s.approved)kv.push(["Approved",s.approved]);
  if(kv.length)h+='<dl class="kv">'+kv.map(x=>'<dt>'+x[0]+'<\/dt><dd>'+esc(x[1])+'<\/dd>').join("")+'<\/dl>';
  if(s.note)h+='<div class="note'+(/NO:|not /.test(s.note)?"":" blue")+'">'+ico("info")+'<div>'+esc(s.note)+'<\/div><\/div>';
  if(s.levels)h+='<div class="sec">Approval levels · '+esc(s.doc)+'<\/div><div class="jlv">'+s.levels.map(l=>'<div><b>L'+l.level+(l.role?' · '+esc(l.role):"")+
    '<\/b><span>'+esc(l.name||l.user)+'<\/span><small>'+esc(l.at)+(l.comment?' · “'+esc(l.comment)+'”':"")+'<\/small><\/div>').join("")+'<\/div>';
  if(s.stock)h+='<div class="sec">Stock<\/div><div class="rl">'+s.stock.map(x=>'<span class="st '+(x.sign==="+"?"st-green":"st-amber")+'">'+x.sign+fmt(x.qty)+
    ' @ '+x.rate+' · '+esc(x.store)+'<\/span>').join("")+'<\/div>';
  const vt=v=>'<table class="jdc"><tr><th>Account<\/th><th class="num">Dr<\/th><th class="num">Cr<\/th><\/tr>'+v.lines.map(l=>'<tr><td>'+esc(l.account)+
    '<\/td><td class="num">'+(l.dr?l.dr.toFixed(3):"")+'<\/td><td class="num">'+(l.cr?l.cr.toFixed(3):"")+'<\/td><\/tr>').join("")+'<\/table>';
  (s.vouchers||[]).forEach(v=>h+='<div class="sec">Accounts entry · '+esc(v.voucher)+' · '+esc(v.date)+'<\/div>'+vt(v));
  if(s.code==="PB"&&!(s.vouchers||[]).length)h+='<div class="note">'+ico("warn")+'<div>No accounts entry for this bill yet.<\/div><\/div>';
  if(s.pay){
    const p=s.pay;
    h+='<dl class="kv"><dt>Paid for this bill<\/dt><dd>'+p.this_bill+'<\/dd><dt>Voucher total<\/dt><dd>'+p.voucher_total+'<\/dd><dt>Bank<\/dt><dd>'+esc(p.bank||"–")+
      '<\/dd><dt>Cheque<\/dt><dd>'+esc(p.cheque||"–")+' '+esc(p.cheque_date||"")+'<\/dd><dt>Posted to bank<\/dt><dd>'+(p.posted?"Yes":"<b>No<\/b>")+'<\/dd><\/dl>';
    if(!p.posted)h+='<div class="note">'+ico("warn")+'<div>The payment voucher exists but is not posted to the bank yet: no bank, no cheque and no accounts entry.<\/div><\/div>';
    p.journal.forEach(v=>h+='<div class="sec">Bank entry · '+esc(v.voucher)+' · '+esc(v.date)+'<\/div>'+vt(v));
  }
  return h;
}

/* ---------- DASHBOARDS (added 10/11/2026) ----------
   data/dash_<name>.js -> ATLAS.dashLoaded(name, data). Built by galaxy/build_dash.py at every refresh (SELECT only).
   Route: #/all/dash/<name>. Oman site: purchase (MR -> PB). Pharmacy site: stock.
   Charts are inline SVG only (the Axpert servers are offline: no CDN, no chart library). */
ATLAS.dash = {};
ATLAS.dashLoaded = function (n, d) { this.dash[n] = d; };
const SITE = () => (ATLAS.meta && ATLAS.meta.site) || "oman";
const DASHES = { oman: [["purchase", "Purchase · MR to PB", "report"], ["ostock", "Stock · 3 ledgers", "apps"]], pharmacy: [["stock", "Pharmacy stock", "apps"]] };
const nf = (n, d) => Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: d == null ? 0 : d });
const DST = {};   /* per-dashboard UI state: list tab + search */

function dashNav(cur) {
  const L = DASHES[SITE()] || [];

  if (!D) { $("#view").innerHTML = '<div class="empty">' + ico("warn") + 'No data for this dashboard yet.<\/div>'; return; }
  ({ purchase: dPurchase, stock: dStock, ostock: dOStock })[name](D);

/* ---------- small chart kit ---------- */
function hbars(rows, opt) {        /* rows: [{l, v, sub, c}] -> horizontal bars, HTML */
  const mx = Math.max(1, ...rows.map(r => r.v));
  return '<div class="hb">' + rows.map(r => '<div class="hbr"' + (r.go ? ' data-go="' + r.go + '"' : "") + '><div class="hbl">' + esc(r.l) + '<\/div><div class="hbt"><span style="width:' + Math.max(0.6, r.v * 100 / mx) + '%;background:' + (r.c || "var(--blue)") + '"><\/span><\/div><div class="hbv num">' + nf(r.v, opt && opt.dec) + (r.sub ? '<small>' + r.sub + '<\/small>' : "") + '<\/div><\/div>').join("") + '<\/div>';
}
function donut(parts, label, sub) {   /* parts: [{l, v, c}] */
  const T = parts.reduce((a, p) => a + p.v, 0) || 1, R = 52, C = 2 * Math.PI * R;
  let off = 0;
  const seg = parts.map(p => { const L = p.v / T * C, s = '<circle r="' + R + '" cx="70" cy="70" fill="none" stroke="' + p.c + '" stroke-width="20" stroke-dasharray="' + L + ' ' + (C - L) + '" stroke-dashoffset="' + (-off) + '"><title>' + esc(p.l) + ': ' + nf(p.v) + '<\/title><\/circle>'; off += L; return s; }).join("");
  return '<div class="dn"><svg viewBox="0 0 140 140" class="dnsvg"><g transform="rotate(-90 70 70)">' + seg + '<\/g><text x="70" y="68" class="dnv">' + nf(T) + '<\/text><text x="70" y="86" class="dns">' + esc(label) + '<\/text><\/svg>' +
    '<div class="dnl">' + parts.map(p => '<div><i style="background:' + p.c + '"><\/i><span>' + esc(p.l) + '<\/span><b class="num">' + nf(p.v) + '<\/b><em>' + pct(p.v, T) + '%<\/em><\/div>').join("") + (sub ? '<p class="dnote">' + sub + '<\/p>' : "") + '<\/div><\/div>';
}
function cols(months, series, opt) {   /* grouped columns, SVG. series: [{k, l, c}] */
  const W = 760, H = 230, pl = 46, pb = 26, pt = 10, n = months.length, g = (W - pl - 8) / n, bw = Math.min(16, (g - 8) / series.length);
  const mx = Math.max(1, ...months.flatMap(m => series.map(s => m[s.k] || 0)));
  const step = Math.pow(10, Math.floor(Math.log10(mx))), top = Math.ceil(mx / step) * step, y = v => pt + (H - pt - pb) * (1 - v / top);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart">';
  for (let i = 0; i <= 4; i++) { const v = top * i / 4; s += '<line x1="' + pl + '" x2="' + W + '" y1="' + y(v) + '" y2="' + y(v) + '" class="gl"/><text x="' + (pl - 6) + '" y="' + (y(v) + 4) + '" class="ax" text-anchor="end">' + nf(v) + '<\/text>'; }
  months.forEach((m, i) => {
    const x0 = pl + i * g + (g - bw * series.length) / 2;
    series.forEach((se, j) => { const v = m[se.k] || 0; s += '<rect x="' + (x0 + j * bw) + '" y="' + y(v) + '" width="' + (bw - 2) + '" height="' + (y(0) - y(v)) + '" rx="2" fill="' + se.c + '"><title>' + esc(m.m + " · " + se.l + ": " + nf(v)) + '<\/title><\/rect>'; });
    s += '<text x="' + (pl + i * g + g / 2) + '" y="' + (H - 8) + '" class="ax" text-anchor="middle">' + mlabel(m.m) + '<\/text>';
  });
  return s + '<\/svg><div class="lg">' + series.map(se => '<span><i style="background:' + se.c + '"><\/i>' + esc(se.l) + '<\/span>').join("") + (opt && opt.note ? '<span class="lgn">' + opt.note + '<\/span>' : "") + '<\/div>';
}
const mlabel = m => ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][+m.slice(5) - 1] + " " + m.slice(2, 4);
const dhead = (D, title, sub, icon) => '<section class="card hero-home spot dhero" style="margin-top:14px"><span class="logo" style="width:56px;height:56px;border-radius:16px"><span style="width:42px;height:42px;border-radius:12px">' + ico(icon) + '<\/span><\/span>' +
  '<div style="flex:1;min-width:0"><h1>' + title + '<\/h1><p>' + sub + '<\/p><div class="dmeta"><span>' + ico("hist") + 'Built ' + esc(D.built) + '<\/span><span>' + ico("code") + esc(D.source) + '<\/span><span>' + ico("lock") + 'Read-only · SELECT only<\/span><\/div><\/div><\/section>';
const rulesBox = D => '<details class="card dsec drules"><summary>' + ico("info") + 'How these numbers are made<\/summary><ol>' + D.rules.map(r => '<li>' + esc(r) + '<\/li>').join("") + '<\/ol><\/details>';
const sec = (title, sub, body, cls) => '<section class="card dsec' + (cls ? " " + cls : "") + '"><div class="dsh"><h2>' + title + '<\/h2>' + (sub ? '<p>' + sub + '<\/p>' : "") + '<\/div>' + body + '<\/section>';

function listTabs(name, tabs, D, redraw) {   /* tabs: [[key, label, rows, cols, search(r)]] */
  const st = DST[name] || (DST[name] = { t: tabs[0][0], q: "" });
  const T = tabs.find(t => t[0] === st.t) || tabs[0];
  const q = st.q.trim().toLowerCase(), rows = q ? T[2].filter(r => T[4](r).toLowerCase().includes(q)) : T[2];
  return '<div class="dtabs">' + tabs.map(t => '<button class="chip' + (t[0] === T[0] ? " on" : "") + '" data-dt="' + t[0] + '">' + t[1] + ' <span class="n">' + nf(t[2].length) + '<\/span><\/button>').join("") +
    '<label class="field dq">' + ico("tune") + '<input id="dq_' + name + '" placeholder="Filter this list" value="' + esc(st.q) + '"><\/label><\/div>' + table("dash_" + name + "_" + T[0], T[3], rows, { sort: T[5] || 0, dir: T[6] || -1, lim: 100 });
}
function bindList(name, redraw) {
  $$("[data-dt]", $("#view")).forEach(b => b.onclick = () => { DST[name].t = b.dataset.dt; redraw(); });
  const i = $("#dq_" + name);
  if (i) i.oninput = () => { DST[name].q = i.value; redraw(); keepFocus("dq_" + name); };
  bindTables($("#view"), redraw);
}

/* ================= OMAN PURCHASE: MR -> PB ================= */
function dPurchase(D) {
  const S = D.steps, first = S[1].n || 1, pb = S[S.length - 1].n;
  const routeC = { "Credit purchase (PO)": "var(--blue)", "Issued from store": "var(--teal)", "Cash purchase": "var(--amber)", "Production": "var(--purple)",
    "Approved, no next step": "var(--grey)", "Rejected": "var(--red)", "MR pending approval": "#e37400", "Short closed": "#a142f4" };
  let h = dhead(D, "Purchase · MR to Purchase Bill", "Every MR line raised since " + esc(D.since) + ", followed through Axpert's own steps: request, RFQ, quote, PO, GRN and the purchase bill. Where each line is, how long each step takes, and what is waiting now.", "report");
  h += '<div class="kpis">' + kpi("form", "var(--blue)", "MR lines", D.lines, "12 months · all routes", "") +
    kpi("tree", "var(--purple)", "Credit purchase road", first, pct(first, D.lines) + "% of MR lines go via PO", "") +
    kpi("ok", "var(--teal)", "PO issued", S[5].n, pct(S[5].n, first) + "% of the road", "") +
    kpi("apps", "var(--green)", "GRN received", S[6].n, pct(S[6].n, first) + "% of the road", "") +
    kpi("report", "var(--green)", "Purchase billed", pb, pct(pb, first) + "% reached PB", "") +
    kpi("warn", "var(--red)", "Waiting now", D.stuck_total, "open lines, not closed", "") + '<\/div>';
  /* funnel */
  const fun = S.slice(1).map((s, i) => {
    const prev = i ? S[i].n : s.n, drop = prev - s.n, w = Math.max(4, s.n * 100 / first);
    return '<div class="fs"><div class="fl"><b>' + esc(s.name) + '<\/b><small>' + (s.med != null ? "median " + nf(s.med, 1) + " days after previous step" : "") + '<\/small><\/div>' +
      '<div class="ft"><span style="width:' + w + '%"><em class="num">' + nf(s.n) + '<\/em><\/span><\/div><div class="fr num">' + pct(s.n, first) + '%' + (i && drop > 0 ? '<small>−' + nf(drop) + '<\/small>' : "<small>&nbsp;<\/small>") + '<\/div><\/div>';
  }).join("");
  h += '<div class="dgrid g2">' + sec("The road: MR line to purchase bill", "Credit-purchase lines only. Bar = lines that reached the step. Small red = lines that did not get to it (yet).", '<div class="fun">' + fun + '<\/div>') +
    sec("Which way each MR line went", "Every approved line takes one route. Only the blue route goes to PO, GRN and bill.",
      donut(D.routes.map(r => ({ l: r[0], v: r[1], c: routeC[r[0]] || "var(--grey)" })), "MR lines")) + '<\/div>';
  /* waiting heatmap */

/* ================= OMAN STOCK · three ledgers (added 11/11/2026) =================
   data/dash_ostock.js <- galaxy/build_dash.py ostock (SELECT only, rebuilt with every refresh).
   main = STOCKVALUE (store ledger) · sub = SUBSTOCKVALUE (cut-piece register) · android = ANDROIDEMPWSTOCK (supervisor stock).
   Quantities only and never added across different items (units differ). Lines are compact arrays, see build_dash.py. */
const OSL = [["main", "Main store stock", "STOCKVALUE", "apps"], ["sub", "Cut pieces & offcuts", "SUBSTOCKVALUE", "tree"], ["android", "Supervisor stock", "ANDROIDEMPWSTOCK", "people"]];
const OSAGE = [[30, "0-30 days", "var(--green)"], [90, "31-90 days", "var(--teal)"], [180, "3-6 months", "var(--blue)"], [365, "6-12 months", "var(--amber)"],
  [730, "1-2 years", "#e8710a"], [1825, "2-5 years", "var(--red)"], [1e12, "Over 5 years", "#a50e0e"]];
function osS() { return DST.ostock || (DST.ostock = { tab: "main", comp: null, store: null, band: null, cat: null, list: "lines", q: "", slist: "instock", sq: "", sup: null, alist: "held", aq: "" }); }
const osD = (D, d) => { if (d == null) return "-"; const t = new Date(D.today + "T00:00:00"); t.setDate(t.getDate() - d); return t.toLocaleDateString("en-GB"); };
const osI = v => v ? String(v).slice(0, 10).split("-").reverse().join("/") : "-";
const osAgo = d => d == null ? "-" : d < 1 ? "today" : d < 60 ? nf(d) + " d" : d < 730 ? nf(Math.round(d / 30.4)) + " mo" : (d / 365).toFixed(1) + " yr";
const osQty = (v, u) => '<b class="num"' + (v < 0 ? ' style="color:var(--red)"' : "") + '>' + nf(v, 3) + '<\/b> <span class="osu">' + esc(u || "") + '<\/span>';
const osK = (act, html) => html.replace('<button class="kpi"', '<button class="kpi" data-act="' + act + '"');
const osAgeOf = r => { const a = Math.min(r[5] == null ? 1e12 : r[5], r[6] == null ? 1e12 : r[6]); return a >= 1e12 ? null : a; };
const osBand = a => a == null ? OSAGE.length - 1 : OSAGE.findIndex(x => a <= x[0]);

function osPrep(D) {
  if (D._p) return D._p;
  const X = D.dict, M = D.main, P = { pos: 0, neg: 0 };
  P.comp = X.comps.map((c, i) => ({ i, lines: 0, neg: 0, items: new Set(), stores: new Set() }));
  P.cats = X.cats.map((c, i) => ({ i, l: c, lines: 0, items: new Set() }));
  const items = new Set(), stores = new Set();
  M.lines.forEach(r => {
    r.age = osAgeOf(r); r.band = osBand(r.age);
    const C = P.comp[r[3]];
    if (r[4] < 0) { P.neg++; if (C) C.neg++; return; }
    P.pos++; items.add(r[0]); stores.add(r[2]);
    if (C) { C.lines++; C.items.add(r[0]); C.stores.add(r[2]); }
    const K = P.cats[X.items[r[0]][2]]; K.lines++; K.items.add(r[0]);
  });
  P.itemsIn = items.size; P.storesIn = stores.size; P.compsIn = P.comp.filter(c => c.lines).length;
  P.old = M.lines.filter(r => r[4] > 0 && r.band >= 4).length;
  P.unknownItems = X.items.filter(x => x[4] === "?").length;
  P.unknownComps = X.comps.filter(c => /not in BRANCH/.test(c[1] || "")).length;
  P.backRows = M.backdated.filter(b => b.map !== "itopn2").reduce((a, b) => a + b.n, 0);   /* the opening rebuild has its own trust card */
  const A = D.android.lines;
  P.aHeld = A.filter(r => r[3] > 0); P.aNeg = A.filter(r => r[3] < 0);
  P.aHolders = new Set(P.aHeld.map(r => r[0]));
  P.left = e => D.left_status.includes(D.dict.emps[e][2]);
  return D._p = P;
}

function osBars(rows, act, sqrt) {   /* clickable horizontal bars: rows [{k, l, sub, v, c, on}]; sqrt = square-root scale for very uneven data */
  const f = sqrt ? Math.sqrt : (x => x), mx = Math.max(1, ...rows.map(r => f(r.v)));
  return '<div class="osbars">' + (rows.length ? rows.map(r => '<button class="osbar' + (r.on ? " on" : "") + '" data-act="' + act + ':' + r.k + '"><span class="osbl">' + esc(r.l) + (r.sub ? '<small>' + r.sub + '<\/small>' : "") + '<\/span><span class="hbt"><span style="width:' + Math.max(0.8, f(r.v) * 100 / mx) + '%;background:' + (r.c || "var(--blue)") + '"><\/span><\/span><b class="num">' + nf(r.v) + '<\/b><\/button>').join("") : '<div class="empty">' + ico("info") + 'Nothing here.<\/div>') + '<\/div>';
}
function osFlow(W, H, nodes, edges) {   /* small SVG flow: nodes [{x,y,w,h,t,s,c}], edges [{d, t, tx, ty}] */
  const box = n => '<g><rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="12" class="osfn" style="--c:' + n.c + '"/><text x="' + (n.x + n.w / 2) + '" y="' + (n.y + n.h / 2 + (n.s ? -3 : 4)) + '" class="osft">' + esc(n.t) + '<\/text>' +
    (n.s ? '<text x="' + (n.x + n.w / 2) + '" y="' + (n.y + n.h / 2 + 13) + '" class="osfs">' + esc(n.s) + '<\/text>' : "") + '<\/g>';
  const ed = e => '<path d="' + e.d + '" class="osfe" marker-end="url(#osar)"/>' + (e.t ? '<text x="' + e.tx + '" y="' + e.ty + '" class="osfl">' + esc(e.t) + '<\/text>' : "");
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="osflow" role="img"><defs><marker id="osar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="osfa"/><\/marker><\/defs>' +
    edges.map(ed).join("") + nodes.map(box).join("") + '<\/svg>';
}
function osSwitch(D, P, S) {
  const K = D.sub.kpi;
  const head = { main: [P.itemsIn, "items in stock", nf(P.pos) + " lines · " + nf(P.storesIn) + " stores"],
    sub: [K.instock, "cut pieces in stock", nf(K.registered) + " registered"],
    android: [P.aHolders.size, "supervisors holding stock", nf(P.aHeld.length) + " lines"] };
  return '<div class="osw">' + OSL.map(l => '<button class="osl spot' + (S.tab === l[0] ? " on" : "") + '" data-act="tab:' + l[0] + '"><span class="ic">' + ico(l[3]) + '<\/span><span class="osln"><b>' + l[1] + '<\/b><code>' + l[2] + '<\/code><\/span>' +
    '<span class="oslv"><b class="num">' + nf(head[l[0]][0]) + '<\/b><small>' + head[l[0]][1] + '<\/small><em>' + head[l[0]][2] + '<\/em><\/span><\/button>').join("") + '<\/div>';
}

/* ---------- tab 1: main store stock ---------- */
function osMain(D, P, S) {
  const X = D.dict, M = D.main;
  let h = '<div class="kpis k6">' + osK("list:items", kpi("apps", "var(--blue)", "Items in stock", P.itemsIn, "distinct items with a balance above 0", "")) +
    osK("list:lines", kpi("report", "var(--teal)", "Stock lines", P.pos, "item × project × store · of " + nf(M.lines_all) + " ever used", "")) +

/* ---------- page + events ---------- */
function dOStock(D, again) {
  const S = osS(), P = osPrep(D);

function osWire(D, root) {

  $$("[data-act]", root).forEach(b => { if (mine(b)) b.onclick = e => { e.stopPropagation(); osAct(D, b.dataset.act); }; });
  $$("[data-item]", root).forEach(a => { if (mine(a)) a.onclick = () => osItem(D, +a.dataset.item); });

function osRedraw(D) { const y = window.scrollY; dOStock(D, true); window.scrollTo(0, y); }
function osAct(D, a) {

/* ---------- DOWNLOADS: Excel (.xlsx) and PDF for a module or for one screen (added 11/11/2026) ----------
   Offline by design (the Axpert servers have no internet, no library may be loaded):
     Excel = a real .xlsx written here by hand (Office Open XML parts inside a plain "stored" ZIP), one sheet per topic.
     PDF   = the browser's own "Save as PDF" on a print-ready page (A4 landscape, header row repeated on every page).
   Nothing is sent anywhere. Works in the encrypted GitHub copy too: the data is already unlocked in memory.
   Uses the module context set by useModule() in app.js (M, S, R, U, forms, reps, H, ...). */

const XLSX = (() => {
  const T = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; T[n] = c >>> 0; }
  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const u8 = s => new TextEncoder().encode(s);
  const xe = s => String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F￾￿]/g, "").replace(/&/g, "&amp;").replace(/[<]/g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const colName = n => { let s = ""; n++; while (n) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };

  async function deflate(d) {               /* raw DEFLATE with the browser's own CompressionStream; null = not available */
    if (typeof CompressionStream === "undefined") return null;
    try { return new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer()); }
    catch (e) { return null; }
  }
  async function zip(files) {               /* files: [{name, data: Uint8Array}] -> Promise<Blob> (ZIP: deflate, else stored) */
    const parts = [], cent = [];
    let off = 0;
    for (const f of files) {
      const nm = u8(f.name), raw = f.data, c = crc32(raw), z = await deflate(raw);
      const method = z && z.length < raw.length ? 8 : 0, d = method ? z : raw;
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, method, true);
      h.setUint16(10, 0, true); h.setUint16(12, 0x21, true); h.setUint32(14, c, true); h.setUint32(18, d.length, true);
      h.setUint32(22, raw.length, true); h.setUint16(26, nm.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), nm, d);
      const e = new DataView(new ArrayBuffer(46));
      e.setUint32(0, 0x02014b50, true); e.setUint16(4, 20, true); e.setUint16(6, 20, true); e.setUint16(8, 0x0800, true);
      e.setUint16(10, method, true); e.setUint16(12, 0, true); e.setUint16(14, 0x21, true); e.setUint32(16, c, true);
      e.setUint32(20, d.length, true); e.setUint32(24, raw.length, true); e.setUint16(28, nm.length, true);
      e.setUint32(42, off, true);
      cent.push(new Uint8Array(e.buffer), nm);
      off += 30 + nm.length + d.length;
    }
    const size = cent.reduce((a, p) => a + p.length, 0), end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, size, true); end.setUint32(16, off, true);
    return new Blob(parts.concat(cent, [new Uint8Array(end.buffer)]), { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  }

  function sheetXml(sh) {                   /* sh: {name, cols: [{h, w, wrap}], rows: [[...]]} */
    const cell = (v, r, c, st) => {
      if (v == null || v === "") return "";
      const ref = colName(c) + r, s = st ? ' s="' + st + '"' : "";
      if (typeof v === "number" && isFinite(v)) return '<c r="' + ref + '"' + s + '><v>' + v + '<\/v><\/c>';
      return '<c r="' + ref + '" t="inlineStr"' + s + '><is><t xml:space="preserve">' + xe(String(v).slice(0, 32000)) + '<\/t><\/is><\/c>';
    };
    const out = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">',
      '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/><\/sheetView><\/sheetViews>',
      '<cols>' + sh.cols.map((c, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + (c.w || 16) + '" customWidth="1"/>').join("") + '<\/cols><sheetData>',
      '<row r="1">' + sh.cols.map((c, i) => cell(c.h, 1, i, 1)).join("") + '<\/row>'];
    sh.rows.forEach((row, ri) => out.push('<row r="' + (ri + 2) + '">' + row.map((v, i) => cell(v, ri + 2, i, sh.cols[i] && sh.cols[i].wrap ? 2 : 0)).join("") + '<\/row>'));
    out.push('<\/sheetData>');
    if (sh.rows.length) out.push('<autoFilter ref="A1:' + colName(sh.cols.length - 1) + (sh.rows.length + 1) + '"/>');
    out.push('<\/worksheet>');
    return out.join("");
  }

  function build(sheets) {                 /* -> Promise<Blob> */
    const used = new Set();
    sheets.forEach(sh => {                  /* Excel sheet names: max 31 chars, no []:*?/\ , unique */
      let n = String(sh.name).replace(/[\[\]:*?\/\\]/g, " ").slice(0, 31) || "Sheet", k = 2;
      while (used.has(n.toLowerCase())) n = n.slice(0, 28) + " " + k++;
      used.add(n.toLowerCase()); sh.name = n;
    });
    const wb = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
      sheets.map((sh, i) => '<sheet name="' + xe(sh.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join("") + '<\/sheets><definedNames>' +
      sheets.map((sh, i) => sh.rows.length ? '<definedName name="_xlnm._FilterDatabase" localSheetId="' + i + '" hidden="1">\'' + xe(sh.name.replace(/'/g, "''")) + '\'!$A$1:$' + colName(sh.cols.length - 1) + '$' + (sh.rows.length + 1) + '<\/definedName>' : "").join("") +
      '<\/definedNames><\/workbook>';
    const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      sheets.map((sh, i) => '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join("") +
      '<Relationship Id="rId' + (sheets.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><\/Relationships>';
    const styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<fonts count="2"><font><sz val="10"/><name val="Calibri"/><\/font><font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Calibri"/><\/font><\/fonts>' +
      '<fills count="3"><fill><patternFill patternType="none"/><\/fill><fill><patternFill patternType="gray125"/><\/fill><fill><patternFill patternType="solid"><fgColor rgb="FF1A73E8"/><bgColor indexed="64"/><\/patternFill><\/fill><\/fills>' +
      '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/><\/border><\/borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/><\/cellStyleXfs>' +
      '<cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment wrapText="1" vertical="top"/><\/xf><\/cellXfs>' +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/><\/cellStyles><\/styleSheet>';
    const types = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      sheets.map((sh, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("") + '<\/Types>';
    const root = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/><\/Relationships>';
    return zip([{ name: "[Content_Types].xml", data: u8(types) }, { name: "_rels/.rels", data: u8(root) }, { name: "xl/workbook.xml", data: u8(wb) },
      { name: "xl/_rels/workbook.xml.rels", data: u8(rels) }, { name: "xl/styles.xml", data: u8(styles) }]
      .concat(sheets.map((sh, i) => ({ name: "xl/worksheets/sheet" + (i + 1) + ".xml", data: u8(sheetXml(sh)) }))));
  }
  return { build };
})();

/* ---------- PDF: print-ready page -> browser "Save as PDF" ---------- */
const PDF_CSS = '@page{size:A4 landscape;margin:11mm 9mm 13mm}*{box-sizing:border-box}body{font:8.6pt/1.35 "Segoe UI",Arial,sans-serif;color:#1f1f1f;margin:0;background:#fff}' +
  'h1{font-size:17pt;margin:0 0 1.5mm}h2{font-size:12pt;margin:6mm 0 2mm;border-bottom:1.4pt solid #1a73e8;padding-bottom:1mm;page-break-after:avoid}' +
  'h3{font-size:10pt;margin:4mm 0 1.5mm;page-break-after:avoid}.sub{color:#5f6368;font-size:8pt}table{border-collapse:collapse;width:100%;margin:1mm 0 3mm}' +
  'table.fx{table-layout:fixed}table.fx td,table.fx th{overflow-wrap:break-word;word-break:normal}' +
  'th{background:#e8f0fe;text-align:left;font-weight:600}th,td{border:.4pt solid #c4c7c5;padding:1mm 1.5mm;vertical-align:top;overflow-wrap:anywhere}' +
  'thead{display:table-header-group}tr{page-break-inside:avoid}td.n,th.n{text-align:right}table.kv td:first-child{width:52mm;color:#5f6368}' +
  '.kpis{display:flex;flex-wrap:wrap;gap:2.5mm;margin:3mm 0}.kpi{border:.5pt solid #c4c7c5;border-radius:2mm;padding:1.8mm 3mm;min-width:36mm}' +
  '.kpi b{display:block;font-size:13pt}.red{color:#d93025}.amber{color:#b06000}.pb{page-break-before:always}' +
  '.code{font:7.6pt/1.3 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.foot{position:fixed;bottom:-9mm;left:0;right:0;font-size:7pt;color:#747775}' +
  '.badge{display:inline-block;border-radius:1.5mm;padding:0 1.5mm;background:#fce8e6;color:#d93025;font-weight:600}';
const pe = v => esc(v == null ? "" : v);
function pTable(cols, rows, opt) {        /* cols: [{h, w, wrap}] from the Excel builders; opt.code = column indexes shown as code */
  opt = opt || {};
  if (!rows.length) return '<p class="sub">None.<\/p>';
  /* fixed layout with the Excel widths as proportions, so short columns (DC, Type, Yes) never break mid-word */
  const tw = cols.every(c => c.w) ? cols.reduce((a, c) => a + c.w, 0) : 0;
  return '<table' + (tw ? ' class="fx"><colgroup>' + cols.map(c => '<col style="width:' + (c.w * 100 / tw).toFixed(2) + '%">').join("") + '<\/colgroup>' : '>') +
    '<thead><tr>' + cols.map(c => '<th>' + pe(c.h) + '<\/th>').join("") + '<\/tr><\/thead><tbody>' +
    rows.map(r => '<tr>' + r.map((v, i) => '<td' + (typeof v === "number" ? ' class="n"' : "") + '>' + ((opt.code || []).includes(i) && v ? '<div class="code">' + pe(v) + '<\/div>' : pe(v)) + '<\/td>').join("") + '<\/tr>').join("") + '<\/tbody><\/table>';
}
const pKv = rows => '<table class="kv"><tbody>' + rows.map(r => '<tr><td>' + pe(r[0]) + '<\/td><td>' + pe(r[1]) + '<\/td><\/tr>').join("") + '<\/tbody><\/table>';
function pdfPage(title, body) {
  return '<!doctype html><html><head><meta charset="UTF-8"><title>' + pe(title) + '<\/title><style>' + PDF_CSS + '<\/style><\/head><body>' + body +
    '<div class="foot">Axpert Atlas · ' + pe(siteName()) + ' · read-only snapshot ' + pe(M.scanned) + ' · printed ' + pe(new Date().toLocaleString("en-GB")) + '<\/div><\/body><\/html>';
}
function pdfPrint(html, title) {
  const f = document.createElement("iframe");
  f.setAttribute("aria-hidden", "true");
  f.style.cssText = "position:fixed;left:-12000px;top:0;width:1200px;height:800px;border:0";
  document.body.appendChild(f);
  const d = f.contentWindow.document;
  d.open(); d.write(html); d.close();
  const old = document.title;
  setTimeout(() => {
    document.title = title;                 /* the browser suggests this as the PDF file name */
    try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { toast("Could not open the print window: " + e.message); }
    document.title = old;
    setTimeout(() => f.remove(), 60000);
  }, 400);
  toast('Choose "Save as PDF" as the printer');
}
const FIELD_PDF = [0, 2, 3, 4, 5, 6, 8, 9, 10, 11, 14, 15];   /* the Excel field columns that fit on a page */
const xlPick = (cols, rows, idx) => [idx.map(i => cols[i]), rows.map(r => idx.map(i => r[i]))];

    h += '<h3>Data containers<\/h3>' + pTable(COLS.dc.slice(1), dcRows([s]).map(r => r.slice(1)));
    const [bc, br] = xlPick(COLS.btn, btnRows([s]), [2, 3, 4, 5, 6, 7, 8, 9, 10]);
    h += '<h3>Cancel & Remove<\/h3>' + pTable(bc, br, { code: [7] });

  if (s.iv) {

}

document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-xl]");
  if (!b) return;
  e.preventDefault();
  try {
    if (b.dataset.xl.endsWith("-x")) toast("Building the Excel file…");
    Promise.resolve(({ "mod-x": () => xlModule(), "mod-p": () => pdfModule(false), "mod-pf": () => pdfModule(true),
       "scr-x": () => xlScreen(SID[b.dataset.id]), "scr-p": () => pdfScreen(SID[b.dataset.id]) })[b.dataset.xl]())
      .catch(err => { console.error(err); toast("Download failed: " + err.message); });
  } catch (err) { console.error(err); toast("Download failed: " + err.message); }
});

</script>
</body>
</html>
